# Cargo configuration for cross-platform builds

[build]
# Parallel compilation jobs
jobs = 4

# Per-target settings for MUSL (static Linux builds)
# For MUSL builds, we use position-independent code and link statically
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "target-feature=+crt-static",
    "-l", "static=ssl",
    "-l", "static=crypto"
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "target-feature=+crt-static",
    "-l", "static=ssl",
    "-l", "static=crypto"
]



