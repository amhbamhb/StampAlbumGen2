stages:
  - verify
  - build
  - publish

# Keep CI simple: validate what should already pass locally, then optionally
# produce a release artifact for default branch and tags.
default:
  image: rust:latest
  before_script:
    - df -h .
    - rm -rf target || true
    - rustc --version
    - cargo --version

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  # Optional host deployment from publish job:
  # - Set WEBSITE_DEPLOY_DIR as a CI/CD variable to enable deployment
  #   Example: WEBSITE_DEPLOY_DIR=/opt/stampalbumgenerator2-site
  # This copies build artifacts directly to the target directory structure:
  #   $WEBSITE_DEPLOY_DIR/static/downloads/current/
  #   $WEBSITE_DEPLOY_DIR/APP_VERSION

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

fmt:
  stage: verify
  script:
    - cargo fmt --all -- --check

check:
  stage: verify
  script:
    - cargo check --workspace --all-targets

test:
  stage: verify
  script:
    - cargo test --workspace --all-features -j 2

build_release:
  stage: build
  script:
    - cargo build --release --bin stamp_album_gen2
    - mkdir -p artifacts
    - cp target/release/stamp_album_gen2 artifacts/
    - |
      if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
        rustup target add x86_64-pc-windows-gnu
        cargo build --release --target x86_64-pc-windows-gnu --bin stamp_album_gen2
        cp target/x86_64-pc-windows-gnu/release/stamp_album_gen2.exe artifacts/
      else
        echo "Skipping Windows cross-build: mingw toolchain not available on runner"
      fi
    - sha256sum artifacts/stamp_album_gen2 | awk '{print $1 "  stamp_album_gen2"}' > artifacts/stamp_album_gen2.sha256
    - |
      if [ -f artifacts/stamp_album_gen2.exe ]; then
        sha256sum artifacts/stamp_album_gen2.exe | awk '{print $1 "  stamp_album_gen2.exe"}' > artifacts/stamp_album_gen2.exe.sha256
      fi
    - |
      cat artifacts/stamp_album_gen2.sha256 > artifacts/SHA256SUMS.txt
      if [ -f artifacts/stamp_album_gen2.exe.sha256 ]; then
        cat artifacts/stamp_album_gen2.exe.sha256 >> artifacts/SHA256SUMS.txt
      fi
    - cksum artifacts/stamp_album_gen2 | awk '{print $1 " " $2 " stamp_album_gen2"}' > artifacts/CRC32SUMS.txt
    - |
      if [ -f artifacts/stamp_album_gen2.exe ]; then
        cksum artifacts/stamp_album_gen2.exe | awk '{print $1 " " $2 " stamp_album_gen2.exe"}' >> artifacts/CRC32SUMS.txt
      fi
    - cp README.md RELEASE_NOTES.md config.toml config_full_example.toml artifacts/
  artifacts:
    name: "stamp_album_gen2-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 14 days
    paths:
      - artifacts/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'

publish_website_downloads:
  stage: publish
  needs:
    - job: build_release
      artifacts: true
  before_script:
    - cd "$CI_PROJECT_DIR"
    - |
      if [[ ! -d "$CI_PROJECT_DIR/../StampAlbumGen2-website" ]]; then
        echo "Website repo not found at $CI_PROJECT_DIR/../StampAlbumGen2-website"
        echo "Cloning website repo..."
        cd "$CI_PROJECT_DIR/.."
        WEBSITE_CLONE_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitinfo.laserspider.info/rust-apps/stampalbumgenerator2-site.git"
        if [[ -n "${WEBSITE_REPO_READ_TOKEN:-}" ]]; then
          WEBSITE_CLONE_URL="https://oauth2:${WEBSITE_REPO_READ_TOKEN}@gitinfo.laserspider.info/rust-apps/stampalbumgenerator2-site.git"
        fi
        git clone "$WEBSITE_CLONE_URL" StampAlbumGen2-website || {
          echo "ERROR: Unable to clone stampalbumgenerator2-site."
          echo "Set WEBSITE_REPO_READ_TOKEN (recommended) or allow CI_JOB_TOKEN cross-project read_repository access."
          exit 1
        }
      fi
  script:
    - bash scripts/publish_website_downloads.sh artifacts ../StampAlbumGen2-website
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'
