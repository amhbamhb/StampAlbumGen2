stages:
  - verify
  - build

# Keep CI simple: validate what should already pass locally, then optionally
# produce a release artifact for default branch and tags.
default:
  image: rust:latest
  before_script:
    - rustc --version
    - cargo --version

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/
    - .cargo/registry/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

fmt:
  stage: verify
  script:
    - cargo fmt --all -- --check

check:
  stage: verify
  script:
    - cargo check --workspace --all-targets

test:
  stage: verify
  script:
    - cargo test --workspace --all-features

build_release:
  stage: build
  script:
    - cargo build --release --bin stamp_album_gen2
    - mkdir -p artifacts
    - cp target/release/stamp_album_gen2 artifacts/
    - cp README.md RELEASE_NOTES.md config.toml config_full_example.toml artifacts/
  artifacts:
    name: "stamp_album_gen2-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 14 days
    paths:
      - artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
