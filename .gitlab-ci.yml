stages:
  - verify
  - build

# Keep CI simple: validate locally, then build release artifacts.
# Deployment is handled separately (manual copy or website repo CI).
default:
  image: rust:latest
  before_script:
    - df -h .
    - rm -rf target || true
    - rustc --version
    - cargo --version

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

fmt:
  stage: verify
  script:
    - cargo fmt --all -- --check

check:
  stage: verify
  script:
    - cargo check --workspace --all-targets

test:
  stage: verify
  script:
    - cargo test --workspace --all-features -j 2

build_release:
  stage: build
  script:
    - cargo build --release --bin stamp_album_gen2
    - mkdir -p artifacts
    - cp target/release/stamp_album_gen2 artifacts/
    - |
      if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
        rustup target add x86_64-pc-windows-gnu
        cargo build --release --target x86_64-pc-windows-gnu --bin stamp_album_gen2
        cp target/x86_64-pc-windows-gnu/release/stamp_album_gen2.exe artifacts/
      else
        echo "Skipping Windows cross-build: mingw toolchain not available on runner"
      fi
    - sha256sum artifacts/stamp_album_gen2 | awk '{print $1 "  stamp_album_gen2"}' > artifacts/stamp_album_gen2.sha256
    - |
      if [ -f artifacts/stamp_album_gen2.exe ]; then
        sha256sum artifacts/stamp_album_gen2.exe | awk '{print $1 "  stamp_album_gen2.exe"}' > artifacts/stamp_album_gen2.exe.sha256
      fi
    - |
      cat artifacts/stamp_album_gen2.sha256 > artifacts/SHA256SUMS.txt
      if [ -f artifacts/stamp_album_gen2.exe.sha256 ]; then
        cat artifacts/stamp_album_gen2.exe.sha256 >> artifacts/SHA256SUMS.txt
      fi
    - cksum artifacts/stamp_album_gen2 | awk '{print $1 " " $2 " stamp_album_gen2"}' > artifacts/CRC32SUMS.txt
    - |
      if [ -f artifacts/stamp_album_gen2.exe ]; then
        cksum artifacts/stamp_album_gen2.exe | awk '{print $1 " " $2 " stamp_album_gen2.exe"}' >> artifacts/CRC32SUMS.txt
      fi
    - cp README.md RELEASE_NOTES.md config.toml config_full_example.toml artifacts/
  artifacts:
    name: "stamp_album_gen2-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 14 days
    paths:
      - artifacts/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'

