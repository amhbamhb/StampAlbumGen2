# - Sets default checkbox states for which fields appear when reviewing stamps.
# - Defines the list of stamp catalog families shown in catalog selectors.
#
# The Review UI is launched with: stamp_album_gen2 --review-ui
# It serves a local browser page for inspecting, comparing, and correcting
# stamp data before generating final album pages.

# TABLE ROW COLORS
# Alternating background colors for the left/right metadata comparison tables.
# Use any valid HTML color name or #RRGGBB hex value.
# Why important:
# - Makes long metadata rows easier to read at a glance.
# - Odd = first/third/... rows; Even = second/fourth/... rows.
# These are row-tint colors applied across both metadata columns.
odd_row_color = "#ffffff"
# Even row color (background) for metadata tables in the Review UI.
even_row_color = "#299af0"

# TABLE COLUMN COLORS
# These colors identify the two columns in each metadata table:
# - First column: metadata field name/key.
# - Second column: metadata value.
# A subtle row tint is layered over these column colors when rows alternate.
first_column_color = "#a4f0a8"
second_column_color = "#ffffff"

# DEFAULT FIELD CHECKBOX STATES
# These control which metadata fields are pre-selected when the Review UI loads.
# Users can toggle any field interactively; these are just the startup defaults.
#
# Why important:
# - Reduces noise for common workflows (e.g. hide rarely-used fields by default).
# - Changes here apply only to the initial state; user selections are not saved.
# - `default_sort_mode` sets the initial left-panel ordering when Review UI opens.
#
# Review UI startup sort order for the left-panel stamp list.
# Allowed values:
# - "year_series_date_catalog" : year then issue date in series then catalog number
# - "catalog"             : catalog number
# - "year_catalog"        : year then catalog number
# - "series_catalog"      : series then catalog number
# - "series_date_catalog" : series then issue date then catalog number
# - "rowid"          : database row id
# - "colnect_id"     : Colnect ID
default_sort_mode = "year_series_date_catalog"

# Stamp metadata fields:
# Series label (grouping name for the stamp set)
default_series_checked = true         
# default description text (from StampWorld/Colnect)
default_description_checked = true    
# default watermark text (from StampWorld/Colnect)
default_watermark_checked = true     
# default stamp designer/artist credit (from StampWorld/Colnect)
default_design_checked = true        
# default engraver credit
default_engraving_checked = true     
# default perforation gauge/type (from StampWorld/Colnect)
default_perforation_checked = true   
# default content type (e.g. commemorative, definitive, etc.)
default_context_checked = true       
# default contextual/historical notes
default_contextual_notes_checked = true

# Colnect data fields:
default_colnect_links_checked = true          
# default Colnect page link for each stamp
default_colnect_image_url_checked = true      
# default colnect metadata.
default_colnect_metadata_checked = true       
# default replace Catlog numbers with matched values (from Colnect)
default_replace_sg_number_checked = true     
# default right unmatched-only checkbox state (show only unmatched right-panel stamps)

default_right_unmatched_only_checked = false  


# CATALOG FAMILY OPTIONS
# List of stamp catalog families shown in the Review UI catalog selectors.
# These power the "preferred catalog" dropdown and the "Other catalogs" fallback list.
#
# Format per entry: "code|label|count"
# - code  : short identifier used in catalog_codes fields (e.g. "sn", "sg")
# - label : human-readable name displayed in the selector
# - count : optional approximate global stamp count (informational only)
#
# Why this list matters:
# - Controls what appears in the catalog selection dropdowns in the UI.
# - The `code` values must match what is stored in your album DB catalog_codes
#   fields (sourced from Colnect). Using an unlisted code still works but will
#   not appear in the selector UI.
# - Entries are shown in order; put most commonly used catalogs first.
# - If empty, the UI falls back to built-in defaults (no selector shown).
#
# Tip: the `code` here should match [stamps].default_catalog_code so the
#      preferred catalog is pre-selected in the UI on load.
#
# ALL RECOGNIZED CATALOG CODES (as of this version):
#   sn  = Scott Number (US; widely used in North American collections)
#   sg  = Stanley Gibbons (UK; standard for Commonwealth/British issues)
#   mi  = Michel (German; dominant in Europe)
#   yt  = Yvert et Tellier (French; standard in Francophone collections)
#   afa = AFA (Scandinavian; used for Nordic countries)
#   ank = ANK / Ankerbuch (Austrian catalog)
#   nvp = NVPH (Dutch; Netherlands Philatelic catalog)
#   un  = Unificato (Italian catalog)
#   col = Colnect internal codes (unique to the Colnect database)
#   wad = WADP / WNS Numbering System (UN postal agency standard)
catalog_family_options = [
