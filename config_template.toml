###################################
# Colnect Metadata / Field Selection
###################################
# This section controls which stamp metadata fields sourced from Colnect.net
# are included in generated album pages (under each stamp entry).
#
# Why this section is important:
# - Colnect provides rich stamp metadata (designers, paper type, print run, etc.)
#   that goes far beyond basic catalog numbers and dates.
# - Including too many fields creates cluttered, hard-to-read album pages.
# - Carefully selecting fields lets you tune the level of detail per collection.
#
# HOW FIELD SELECTION WORKS (read carefully — two mechanisms interact):
#
# Mechanism 1: detail_fields (comma-separated list)
#   - Simple fallback used only when NO [colnect.fields] value is explicitly set.
#   - Lists field names in the order you want them displayed.
#   - Easy to change without touching individual toggles.
#
# Mechanism 2: [colnect.fields] per-field toggles
#   - Takes PRECEDENCE over detail_fields when at least one field is explicitly
#     set (true or false).
#   - If any toggle is present, the detail_fields list is ignored.
#   - This means album overrides can disable a global true field by setting it
#     to false locally.
#   - Use this for precise per-field control.
#
# Recommended approach:
# - Use detail_fields for quick experimentation.
# - Switch to [colnect.fields] toggles once you know which fields you want.
# - Never mix both active simultaneously (detail_fields will be silently ignored).

# Master toggle: set false to suppress ALL Colnect metadata from album output.
# Why important:
# - Provides a single switch to strip all Colnect detail without deleting config.
# - Useful when generating clean overview pages without metadata clutter.
include_details = true

# MECHANISM 1: Comma-list field selection (active when no [colnect.fields] values are set)
#
# List field names in display order, separated by commas.
# Only fields listed here will appear in the album output.
#
# All available field names:
#   name           - Colnect item title/name
#   catalog_codes  — Cross-catalog identifiers (Scott, SG, Michel, etc.)
#   country        - Country value from Colnect
#   colnect_link   - Colnect page URL
#   issued_on      — Official issue date
#   expiry_date    — Date stamp was withdrawn from sale (if known)
#   width          - Width only (mm)
#   height         - Height only (mm)
#   size           — Physical stamp dimensions (mm)
#   themes         — Subject/topic tags (e.g. "Animals", "Space", "Royalty")
#   printing       — Printing process (e.g. recess, lithography, photogravure)
#   printing_type  — Sub-type of printing method
#   paper          — Paper type used (e.g. chalk-surfaced, ordinary)
#   gum            — Gum/adhesive type (e.g. PVA, gum arabic)
#   designers      — Stamp designer credit(s)
#   printers       — Printing firm credit(s)
#   colors         — Color description as listed in catalog
#   watermark      — Watermark type/orientation
#   format         — Stamp format (e.g. vertical, horizontal, se-tenant)
#   emission       — Emission type (e.g. definitive, commemorative, airmail)
#   perforation    — Perforation gauge(s)
#   face_value     — Denomination as printed on stamp
#   currency       - Currency label (e.g. Dutch cent)
#   print_run      — Known or estimated quantity printed
#   score          — Colnect community popularity/score value
#   accuracy       - Colnect confidence/accuracy value
#   ord_mi         - Michel ordering/ranking value from Colnect
#   ord_sn         - Scott ordering/ranking value from Colnect
#   ord_yt         - Yvert ordering/ranking value from Colnect
#   ord_sg         - SG ordering/ranking value from Colnect
#   parent_item    - Parent Colnect item ID/reference
#   variant        - Variant marker
#   overprint_variant - Overprint variant marker
#   list           - List metadata from Colnect
#   quantity       - Quantity metadata from Colnect
#   condition      - Condition metadata from Colnect
#   public_note    - Public note text from Colnect
#   private_note   - Private note text from Colnect
#   description    — Free-text description from Colnect
detail_fields = "print_run,themes,designers,printing_type"

# MECHANISM 2: Per-field toggles (takes precedence over detail_fields above)
#
# Set any field to true to include it; false to exclude it.
# As soon as at least one field is explicitly set here (true or false),
# detail_fields is ignored entirely.
#
# Why use toggles instead of detail_fields:
# - More explicit and readable for permanent configs.
# - Easy to enable/disable individual fields without retyping the whole list.
# - Allows commenting out a field without losing its position.
[colnect.fields]
# Colnect item title/name
name = false           
# Cross-catalog identifiers (sn:540, sg:824, etc.)
catalog_codes = true   
# Country value from Colnect
country = false
# Colnect page URL
colnect_link = false  
# Official issue/release date
issued_on = true      
# Withdrawal-from-sale date (often unknown)
expiry_date = true  
# Width only, in mm   
width = false  
# Height only, in mm        
height = false 
# Physical stamp size in mm (width x height)        
size = true 
# Subject tags / topical categories           
themes = true    
# Printing process (e.g. recess, offset lithography)     
printing = true
# Sub-category of printing method        
printing_type = true 
# Paper type or surface  
paper = true 
# Gum/adhesive type (PVA, dextrin, etc.)         
gum = true 
# Designer name(s)            
designers = true    
# Printer/manufacturer name(s)   
printers = true  
# Color description from catalog      
colors = true  
# Watermark type and orientation        
watermark = true       
# Stamp format (vertical, horizontal, miniature sheet, etc.) 
format = true 
# Emission category (definitive, commemorative, airmail, etc.)        
emission = true
# Perforation gauge(s) — e.g. "14 x 13.5"        
perforation = true   
# Denomination as printed on stamp 
face_value = true  
# Currency label (e.g. Dutch cent)    
currency = false   
# Quantity printed (if known)    
print_run = true      
# Colnect community popularity score (0–100) 
score = true  
# Colnect confidence/accuracy value         
accuracy = false  
# Michel ordering/ranking value from Colnect     
ord_mi = false   
# Scott ordering/ranking value from Colnect      
ord_sn = false   
# Yvert ordering/ranking value from Colnect      
ord_yt = false   
# SG ordering/ranking value from Colnect      
ord_sg = false 
# Parent Colnect item ID/reference        
parent_item = false 
# Variant marker  
variant = false  
# Overprint variant marker      
overprint_variant = false
# List metadata from Colnect 
list = false  
# Quantity metadata from Colnect         
quantity = false
# Condition metadata from Colnect       
condition = false  
# Public note text from Colnect    
public_note = false   
# Private note text from Colnect 
private_note = false   
# Free-text description from Colnect page
description = true     

# Legacy passthrough sections kept for backward compatibility.
# They are documented so Review UI no longer groups them under "Preserved".
[colnect.fields.layout]
# Mirrors layout/pages-vspace behavior
# When true, stamp row height calculations include the vertical spacing
# between rows.  This can help avoid row overflow when vspace is non-zero.

pages_vspace_in_row_height = true   
# Mirrors heading-height inclusion behavior 
# When true, stamp row height calculations include the vertical space
# taken up by the heading text.  This can help avoid row overflow when
# headings are present and vspace is non-zero.
stamp_heading_in_row_height = true   

[colnect.fields.runtime]
# These fields control runtime behavior and diagnostics for the generator.
# optional calibration data file path (CSV) for fine-tuning DPI calculations.
calibration_csv = ""                 # Optional calibration data file path
# Date formatting mode for exports.  Allowed values: "commas" (default) or "dashes".
date_format = "commas"               # Date formatting mode for exports
# Enables detailed page-fit diagnostics
detailed_page_fit = false            # Enables detailed page-fit diagnostics
# Enables detailed page-fit diagnostics for every stamp placement decision
detailed_page_fit_diagnostics = false # Emits extra page-fit debug diagnostics
# Enables placeholder-image debug diagnostics
emit_placeholder_diagnostics = false # Emits placeholder-image debug diagnostics

# Native diagnostic proof only; not consumed by the main application.
# All fields are required by the native loader, even when the guide is disabled.
[native_pdf.proof]
page_count = 3
guide_enabled = true
guide_width_mm = 0.1
guide_colour = "black" # Opaque SVG named colour, independent of album border colour.

# Native per-line colours. Edit each independently; all three are required.
# Without this table, the explicit color_album_border value colours all lines.
[native_pdf.border_colours]
outer = "black"
inner1 = "black"
inner2 = "black"

# Native repeating page title. Disabled by default to retain geometry-only proof.
# Font/size use [header].album_pages_title_font/size; colour uses [colors].color_album_title.
[native_pdf.title]
enabled = false
text = "Stamp Album"
vspace_after_mm = 0.0
minimum_height_mm = 0.0 # Automatic measured height; positive values reserve at least this height.

# Native page header in the top margin, independent of the page title.
# Position uses [header].album_pages_header_position; colour uses [colors].color_album_header.
[native_pdf.header]
enabled = false
font = "HN"
size_pt = 8.0
text = "Stamp Album Header"
padding_mm = 0.0 # Positive moves away from the top border; negative moves closer.
minimum_height_mm = 0.0 # Automatic; positive values enlarge reservation below the text.

# Native text footer; independent of the existing [footer] page-number settings.
# Colour uses [colors].color_album_footer; numbering/date expansion is pending.
[native_pdf.footer]
enabled = false
font = "HN"
size_pt = 8.0
position = "C" # L, C, R, LR (odd-left/even-right) or RL.
text = "Stamp Album Footer"
padding_mm = 0.0 # Positive moves down, away from the bottom border; negative moves closer.
minimum_height_mm = 0.0 # Automatic; positive enlarges reservation above the text.

# Native page-number opt-in; uses explicit existing [footer] number values
# and native footer padding/height plus [colors].color_album_footer.
[native_pdf.footer_number]
enabled = false
# document preserves one sequence; section restarts after explicit native section markers.
scope = "document"
# First displayed number in section scope; use an integer such as 10 to customize it.
section_start = 1

# Independent header labels; share native header padding/height and header colour.
[native_pdf.header_number]
enabled = false
font = "HN"
size_pt = 8.0
position = "R" # Physical-page parity: L, C, R, LR or RL.
start = 1
before = "Page "
after = " of $PAGES$" # Final document count, not the last printed label.

# Generation date is local and captured once per document. Fixed mode is reproducible.
# Every field, including the inactive fixed override, must be valid.
[native_pdf.header_date]
enabled = false
font = "HN"
size_pt = 8.0
position = "L" # L, C, R, LR or RL; independent of header text/number position.
format = "YMD" # YMD, DMY or MDY.
separator = "-"
before = "Generated: "
after = ""
date_source = "generation" # generation or fixed.
fixed_date = "2026-01-01" # Used only when date_source = "fixed"; YYYY-MM-DD.

# Footer generation date; shares footer padding/height/colour, not its text style.
[native_pdf.footer_date]
enabled = false
font = "HN"
size_pt = 8.0
position = "L" # L, C, R, LR or RL.
format = "YMD" # YMD, DMY or MDY.
separator = "-"
before = "Generated: "
after = ""
date_source = "generation" # Header/footer generation modes share one document date.
fixed_date = "2026-01-01" # Strict YYYY-MM-DD; used only in fixed mode.

# Optional ALBUM_PAGES_CROP_MARKS; all values explicit even when disabled.
# AlbumEasy preserves page size; outer arms may be clipped (reported as a warning).
# Width 0 is a PDF hairline, not off. Set enabled=false to omit marks.
[native_pdf.crop_marks]
enabled = false
line_width_mm = 0.1
horizontal_padding_mm = 1.0
vertical_padding_mm = 1.0
arms_mm = 5.0
colour = "black"

# Optional corner/edge-PNG decorative border; definition commands override this explicit
# omitted-command policy. Relative paths resolve beside this config, then PNGs
# beside the definition. Edge padding is signed and applies to its orientation.
[native_pdf.decorative_border]
enabled = false
definition_file = ""
image_scale = 1.0
corner_padding_h_mm = 0.0
corner_padding_v_mm = 0.0
line_outer_mm = 0.0
line_inner1_mm = 0.0
line_inner2_mm = 0.0
line_spacing_mm = 0.0
line_padding_h_mm = 0.0
line_padding_v_mm = 0.0
end_offset_h_mm = 0.0
end_offset_v_mm = 0.0
edge_padding_h_mm = 0.0
edge_padding_v_mm = 0.0
colour = "black"

[native_pdf.rows]
# Native proof/layout only: existing AlbumEasy generation is unchanged.
# Applies to every row in the section, including the last row and text-only
# continuations. A new section can select another alignment and starts a new row.
# left/right: anchor the complete row at that usable-page edge; keep the configured
# horizontal gap unchanged. Alignment uses full text/frame footprints, not images.
# center (NEW NATIVE DEFAULT): distribute items with equal internal and outer gaps.
# Example: usable width 180 mm, three 40 mm footprints => four equal 15 mm gaps.
# If equal gaps would be smaller than album_pages_spacing_h, preserve that minimum
# internal gap and divide the remaining space equally between the two outer edges.
# justified: first/last footprints touch usable-page edges; spread spare width
# equally between items, including on the last row. A singleton is centered.
# Single-item rows/text continuations are centered in both center and justified.
# Never stretches frames, stamp images, glyphs or text; vertical layout is unchanged.
# If this optional table is absent, native rows still use center. If present,
# alignment is required; invalid/unknown values fail rather than silently default.
# TXT EXPORT CONTRACT: this is not an AlbumEasy command; do not emit it into TXT.
# Future last-row-left/last-row-center variants need new native commands and an
# explicit compatibility mapping to the three main AlbumEasy modes; not implemented.
alignment = "center"

# Native stamp text layout; this table is NOT an AlbumEasy command section.
# Template comments are also field help in the existing configuration UI.
[native_pdf.stamp_text]
# Opt in to the measured stamp-text proof/layout policy below.
# CURRENT SCOPE: native text-layout proofs only; the production album generator
# and legacy AlbumEasy renderer do not use this table yet. No backend is switched.
# false leaves this policy inactive; all supplied fields are still validated.
# Older configs may omit this entire table. If present, supply every field.
enabled = false
# Choose exactly "wrap_to_frame" or "expand_footprint".
# wrap_to_frame: wrap headings/captions to the MOUNTING FRAME width, not the
# picture width. Preserve explicit newlines; normalize repeated spaces while
# wrapping; split overlong words at character boundaries. Never reduce font size.
# A glyph wider than the frame is an error. Reserve all resulting text height.
# This is the compatibility-oriented choice, NOT certified AlbumEasy parity:
# line wrapping/fonts/row positions must still be compared with AlbumEasy.
# expand_footprint: preserve explicit newlines; wrap lines that exceed the
# expanded_width_limit/expanded_width_value cap specified below.
# The item width is max(frame width, widest heading/caption) plus horizontal
# padding on BOTH sides. Long text may move this item or following items to
# another row. Its measured text height is ALSO reserved, with vertical padding.
# This native enhancement may change row/page breaks compared with AlbumEasy.
# BOTH modes leave physical perforation-tip size, mounting frame and image
# scale unchanged. A footprint is reserved layout space, NOT a larger stamp.
# TXT EXPORT CONTRACT: never write this setting as an AlbumEasy command.
# Keep actual text. Any export adaptation must be explicit in TXT comments
# and compatibility findings; native settings remain saved in TOML.
# Existing production TXT export is unchanged and does not apply this policy.
width_policy = "wrap_to_frame"
# Expanded-mode text width cap: choose exactly "percent" or "mm".
# percent uses the MOUNTING FRAME width, including mounting clearance:
# expanded_width_value = 120 means up to 20% wider than the frame.
# mm uses an absolute text width: expanded_width_value = 30 means 30 mm.
# The cap is a maximum, NOT a forced width; shorter text keeps a smaller footprint.
# It applies BEFORE horizontal footprint padding; that padding is added outside.
# Lines longer than the cap wrap without reducing font size; explicit newlines
# and blank lines remain. Overlong words split at character boundaries.
# No fixed line-count limit: reserve ALL measured lines and their full height.
# The single-page proof still errors if the total footprint cannot fit; it
# never truncates text, silently caps line count, or automatically paginates.
# wrap_to_frame ignores this cap and wraps to frame width instead, but both
# cap settings must still be syntactically valid even when inactive/disabled.
# This is native-only; do not emit these keys as AlbumEasy commands.
expanded_width_limit = "percent"
# Value for expanded_width_limit: finite percent >= 100, or finite positive mm.
# 120 percent on a 28 mm frame => 33.6 mm text cap; with 2 mm padding per
# side, the complete footprint is at most 37.6 mm wide (not a larger frame).
# 30 mm on that frame => up to 34 mm footprint with the same padding.
# In expanded mode an mm cap BELOW an item's mounting-frame width is an error,
# even if that item has no text. Raise the cap or choose percent for mixed sizes.
# Changing this value may wrap more lines, increase height and change row breaks.
# Physical stamp size, mounting frame and font size remain unchanged.
expanded_width_value = 120.0
# Extra reserved space PER SIDE, outside the union of frame and text, in mm.
# Total item width = max(frame width, measured text width) + 2 * this value.
# In wrap_to_frame mode the wrap limit remains frame width; this padding does
# NOT narrow the text area, enlarge the mounting frame, or alter page margins.
# Horizontal row spacing is additional, between complete item footprints.
# Example: 28 mm frame, 40 mm text, padding 2 => 44 mm expand-mode footprint.
# Finite nonnegative mm; 0 means no extra horizontal footprint padding.
horizontal_padding_mm = 0.0
# Extra reserved space PER EDGE above/below the complete frame/text union.
# Total height = frame height + heading height/gap (if present) + caption
# height/gap (if present) + 2 * this value. Multiline height uses font metrics
# and line spacing, not just the font size. Applies to BOTH width policies.
# This is NOT physical mounting clearance and does not change the page margin.
# Vertical row spacing is additional, below the tallest complete item footprint.
# Finite nonnegative mm; 0 means no extra vertical footprint padding.
vertical_padding_mm = 0.0
# Distance in mm from frame top to heading bottom, and frame bottom to caption
# top. Add one gap for each text block present; absent text adds no gap.
# Separate from mounting clearance, footprint padding and inter-row spacing.
# Example: 31 mm frame + 5 mm heading + 3 mm gap + 8 mm caption + 3 mm gap
# + 1 mm vertical padding at each edge => 52 mm total item height.
# Text/frame overflow is an explicit error in the single-page proof; automatic
# pagination and production text-aware row integration are not implemented yet.
# Finite nonnegative mm. A zero gap permits touching, not overlapping.
text_gap_mm = 3.0

# Native-only side labels beside stamp frames; these settings are used only by
# NATIVE_STAMP_IMAGE_SIDE_LABEL and are not AlbumEasy TXT settings.
# The command uses these TOML values unless it supplies per-item size, width,
# or line overrides. Keep the stamp/frame physical size unchanged; wrapped label
# footprints move neighboring stamps and rows. A page-boundary conflict fails.
[native_pdf.stamp_image_side_labels]
# Default font size in points; per-item command sizes override this value.
font_size_pt = 3.5
# Default maximum width of each wrapped side label, in mm.
wrap_width_mm = 20.0
# Allowed lower/upper wrap width for per-item overrides, in mm.
minimum_wrap_width_mm = 5.0
maximum_wrap_width_mm = 40.0
# Default maximum wrapped lines per side label.
max_lines = 4
# Allowed lower/upper maximum-line count for per-item overrides.
minimum_max_lines = 1
maximum_max_lines = 8
