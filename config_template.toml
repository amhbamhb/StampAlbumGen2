###################################
# Page
###################################
[page]
# Physical page size and margins (mm)
# Typical values:
# - US Letter: 216.0 x 279.4
# - A4: 210.0 x 297.0
album_page_width_mm = 216.0
# Typical values:
# - US Letter: 216.0 x 279.4
# - A4: 210.0 x 297.0
album_page_height_mm = 279.4
# Margins (mm) around the page content area
page_top_margin_mm = 10.0
# Margins (mm) around the page content area
page_bottom_margin_mm = 10.0
# Margins (mm) around the page content area
page_left_margin_mm = 10.0
# Margins (mm) around the page content area
page_right_margin_mm = 10.0

# Page border and spacing controls
# page_border_outer  : outer line thickness
# page_border_inner1 : first inner line thickness
# page_border_inner2 : second inner line thickness
# page_border_spacing: gap between border lines
page_border_outer = 0.1
# page_border_inner1  : first inner line thickness
page_border_inner1 = 0.5
# page_border_inner2  : second inner line thickness
page_border_inner2 = 0.1
# page_border_spacing : gap between border lines
page_border_spacing = 1.0
# Horizontal within-page spacing (mm), including left/right content insets
album_pages_spacing_h = 3.0
# Vertical gap between elements on a page (mm), not a page-edge inset
album_pages_spacing_v = 3.0
# Maximum vertical spacer emitted between sections before a new page is preferred
max_page_vspace_mm = 10.0

# Optional native PDF proof setting (not yet used by the main application).
# Uncomment the entire table for explicit even physical-page margins (mm).
# Without it, every page uses the base margins above; no automatic mirroring.
# [page.even_margins]
# left_mm = 10.0
# right_mm = 10.0
# top_mm = 10.0
# bottom_mm = 10.0

###################################
# Header / Footer
###################################
[header]
# Font token for the page title area (for example HN, HB, TN)
album_pages_title_font = "HN"
# Title font size in points
album_pages_title_size = 10.0
# Title position: L (left), C (center), R (right)
album_pages_header_position = "C"

# Stamp Header content toggles
# include the designer credit in the header (if available)
include_design = true
# Include the stamp engraver in the header (if available)
include_engraving = true
# Include the stamp watermark in the header (if available)
include_watermark = true
# Include the stamp perforation in the header (if available)
include_perforation = true
# Include the stamp catalog number in the header (if available)
include_catalog_numbers = true
# Include the stamp series in the header (if available)
include_series = true
# Include the stamp country in the header (if available)
include_country = true
# Include the stamp issue date in the header (if available)
include_date = true

# Spacing around section headers (mm)
# Space before each section heading
header_vspace_before_mm = 1.0
# Space after each section heading
header_vspace_after_mm = 2.0

[footer]
# Enable/disable page number footer
album_pages_footer_number_enabled = true
# Font token for the page number footer (for example HN, HB, TN)
album_pages_footer_number_font = "HN"
# Font size in points for the page number footer
album_pages_footer_number_size = 8.0
# Position: L, C, R, LR (odd-left/even-right), RL (reverse physical parity)
album_pages_footer_number_position = "C"
# Starting page number
album_pages_footer_number_start = 1
# Prefix/suffix around the page counter token
album_pages_footer_number_before = "Page "
# Suffix around the page counter token
album_pages_footer_number_after = " of $PAGES$"

###################################
# Stamps
###################################
[stamps]
# Base sizing (mm)
# Base width reference used when real dimensions are unavailable
reference_width_mm = 19.0
# Base height reference used when real dimensions are unavailable
reference_height_mm = 25.0
# Target box height for stamp image rows
target_stamp_height_mm = 25.0
# Fine adjustment applied on top of each stamp's emitted box size.
stamp_box_adjust = 0.0

# Packing limits
# Hard cap of stamps placed in one row
max_stamps_per_row = 5
# Hard cap of rows per page
max_rows_per_page = 5
# Extra horizontal safety space to reduce clipping/overflows
packing_horizontal_safety_mm = 8.0
# Extra vertical safety space to reduce clipping/overflows
packing_vertical_safety_mm = 1.0
# Additional vertical gap between distinct series rows
series_row_gap_mm = 0.0

# Stamp details layout
# - inline: details inside stamp text fields
# - separate_rows: details in dedicated row/box area
# - minimal: no detail metadata
stamp_detail_layout = "separate_rows"
# Font size (in points) used for the separate detail row emitted below each stamp
# when stamp_detail_layout = "separate_rows". This controls the text size for
# description, catalog codes, color, and other metadata displayed beneath stamps.
# Default: 6 (small enough to fit several lines without pushing stamps apart)
stamp_detail_font_size = 6
# Vertical spacing (mm) used as the vspace in the ROW_START_ES command that opens
# the detail row. This controls the gap between the stamp image row and the detail
# text row below it. Only applies when stamp_detail_layout = "separate_rows".
# Default: 3.5 mm
stamp_detail_vspace = 3.5

# Stamp row value visibility (under each image)
# Left value: denomination / face value fallback
include_denomination = true
# Center top value: print-run / stamps-issued count
include_stamps_issued = true
# Center body text: main stamp description
include_description = true
# Center bottom text: stamp color such as multicoloured
include_color = true
# Right first value: mint condition (falls back to unused when mint is empty)
include_mint_unused = true
# Right second value: used value/condition
include_used = true

# Large-stamp behavior
# Allow one oversized stamp to consume most of a page
allow_single_large_stamp_per_page = true
# Fraction of usable width/height at which a stamp is considered "large"
single_stamp_threshold_pct = 0.7
# Extra usable page height padding when fitting rows
usable_height_padding_mm = 1.0

# Row text/image metrics
# Estimated text line height used for spacing calculations
text_line_height_mm = 2.6
# Gap between image and text blocks inside stamp rows
image_spacing_mm = 1.0

# Global stamp image sizing offsets (mm)
# Width/height offsets applied after base dimension estimation
extra_width_mm = 3.0
# Height offset applied after base dimension estimation
extra_height_mm = 3.0
# Keep source image proportions when true
album_stamp_img_new_setting_preserve_aspect = true
# Legacy/global aspect-ratio guard (keep true in most cases)
preserve_aspect = true
# Legacy/global aspect-ratio guard (keep true in most cases)
album_stamp_img_aspect_ratio = true

# Global scale multiplier applied to ALL size/spacing values before rendering.
# Use to uniformly scale an entire layout up or down without editing each field.
# 1.0 = no scaling.  Example: 0.9 shrinks everything 10 %.
global_scale = 1.0

# Row-height accounting
# Legacy compatibility setting: visible headings are always measured.
stamp_heading_in_row_height = false
# Legacy compatibility setting: explicit vertical spacing is always measured.
pages_vspace_in_row_height = false

# Stamp heading style
# Default catalog family used when choosing a catalog number from Colnect.
# Examples:
# - sn = Scott
# - sg = Stanley Gibbons
# - mi = Michel
# - yt = Yvert
# - afa = AFA
# - ank = ANK
# - nvp = NVPH
# - un = Unificato
# - col = Colnect codes
# - wad = WNS (WADP Numbering System)
# Tip: this should usually match one of the catalog codes listed in
#      [review_ui].catalog_family_options.
default_catalog_code = "sn"
# Font token for the heading line above each stamp entry
stamp_heading_font = "HN"
# Heading font size in points
stamp_heading_size = 6.0
# "auto" = use the display name for default_catalog_code
# ""     = hide the label entirely
# Any other text value is used verbatim as the heading label.
stamp_heading_label = "auto"

###################################
# Layout
###################################
[layout]
# Extra inter-character spacing for row text
row_font_spacing = 0.1
# Extra spacing around header text blocks
header_font_spacing = 2.0
# Conservative page-fit padding before forcing a new page
# Default vertical alignment for stamp rows (ROW_ALIGN_TOP, ROW_ALIGN_MIDDLE, ROW_ALIGN_BOTTOM)
# row_align_default = "ROW_ALIGN_TOP"

page_fit_conservative_buffer_mm = 2.0

# Legacy marker setting. Header spacing now always uses configured numeric
# header_vspace_before_mm / header_vspace_after_mm values.
page_vspace_marker = ""

# ROW_START_ES behavior
# Diagnostic marker row emitted before each series row group
row_start_es_enabled = true
# Font token for the ROW_START_ES marker line
row_start_es_font = "HN"
# Font size (points) for the ROW_START_ES marker line
row_start_es_size = 6.0
# Extra horizontal spacing (mm) around the ROW_START_ES marker line
row_start_es_spacing = 0.1
# Extra vertical spacing (mm) above the ROW_START_ES marker line
row_start_es_vspace = 6.0
# Custom marker string emitted for ROW_START_ES lines in album output.
row_start_es_marker = "ROW_START_ES"
row_start_js_marker = "ROW_START_JS"
row_start_fs_marker = "ROW_START_FS"

# Row packing diagnostics / centering
# NOTE: enable_row_centering is accepted by the config parser but is NOT
# currently applied — row centering is a prototype feature that has not been
# implemented in the layout engine.  Leave true for future compatibility.
enable_row_centering = true
# Emit diagnostics for stamps-per-row decisions
show_stamps_per_row = true
# Order strategy for series sorting: first_date, first_sg, first_sg_desc, alpha
series_order = "first_date"

###################################
# Colors
###################################
[colors]
# AlbumEasy color values:
# - Named HTML/CSS colors (examples):
#   black, white, red, blue, darkblue, navy, green, darkgreen,
#   teal, purple, maroon, olive, gray, silver, orange, gold,
#   brown, cyan, magenta, yellow
# - Native page borders use opaque SVG named colors (case-insensitive).
# - AlbumEasy 4.5 border probes rejected bare and quoted hex forms.
#   Use named colors here; hex/RGB functions/transparency are not supported
#   by the native COLOUR_ALBUM_BORDER command.
#
# Tips:
# - Keep quotes around values in TOML.
# - Native color_album_border is active; other native color commands are pending.
# - Start with border/text colors first, then tune title/header/footer.
# Shared legacy colour; native per-line settings below take precedence.
color_album_border = "black"
## Album title, header, footer, and margin text colors
color_album_footer = "black"
# Album page header text color 
color_album_header = "black"
# Album title text color
color_album_title = "black"
# Album margin text color
color_album_margin_txt = "darkblue"
# Stamp page Border color
color_stamp_border = "black"
# Stamp page heading  color
color_stamp_heading = "black"
# Stamp page text color
color_stamp_text = "black"
# Stamp page background color
color_stamp_background = "black"

###################################
# Flag Cover
###################################
[flag_cover]
# Cover page behavior:
# - When true, prepend a dedicated cover page before stamp pages.
# - If a flag image is found, use the image-based layout.
# - If no flag image is found, use the text-only layout values below.
print_flag_cover = true
# Preferred rendered flag image size on the cover (mm).
# Typical ranges:
# - width : 120.0 .. 180.0
# - height: 60.0  .. 110.0
# Keep the width/height ratio close to the source flag to avoid distortion.
# Preferred width rendered flag image size on the cover (mm).
flag_cover_img_w_mm = 160.0
# Preferred height rendered flag image size on the cover (mm).
flag_cover_img_h_mm = 80.0

# Cover page background color (see [colors] section for supported values).
# Leave empty to use the default white/unset background.
flag_cover_background_color = ""

# Cover element rendering order.
# List which elements appear on the cover and in what order.
# Recognized values: "coat" (coat of arms), "flag", "name" (country name text).
# Remove an entry to omit that element from the cover entirely.
flag_cover_elements = ["coat", "flag", "name"]

# Coat-of-arms image size on the cover (mm).
# Used when a coat_of_arms image is included in the cover layout.
flag_cover_coat_img_w_mm = 80.0
flag_cover_coat_img_h_mm = 80.0

# IMAGE-BASED COVER LAYOUT
# Top spacing from page content area to the first cover element.
flag_cover_page_vspace_top = 20.0
# Vertical gap between the flag image and title text (mm).
flag_cover_image_vspace_after = 12.0
# Font token for title shown under/near the flag image.
# NOTE: flag_cover_image_title_font is accepted but NOT currently applied —
# the font for image-based cover titles is hardcoded to "TB" internally.
flag_cover_image_title_font = "HN"
# Title size (points) for image-based cover.
flag_cover_image_title_size = 32.0
# Additional scale multiplier for image-based title text.
# 1.0 = no scaling, >1.0 larger, <1.0 smaller.
flag_cover_image_title_scale = 1.0

# TEXT-ONLY COVER LAYOUT (used when no flag image is available)
# Top spacing from page content area to title (mm).
flag_cover_text_only_vspace_top = 24.0
# Font token for title in text-only mode.
# NOTE: flag_cover_text_only_title_font is accepted but NOT currently applied —
# the font for text-only cover titles is hardcoded to "TB" internally.
flag_cover_text_only_title_font = "HN"
# Title size (points) for text-only cover.
flag_cover_text_only_title_size = 48.0
# Additional scale multiplier for text-only title text.
# Useful when you want coarse adjustment without changing base size.
flag_cover_text_only_title_scale = 1.0
# Extra space after text-only title block (mm).
# Increase this if first content on next section appears too tight.
flag_cover_text_only_vspace_after = 18.0

###################################
# Wikipedia Data Sources
###################################
[data_sources]
# Wikipedia source behavior:
# - `fetch_wikipedia` controls whether online fetch/cache is attempted.
# - `include_wikipedia_content` controls whether fetched content is rendered
#   into album output pages.
# - `wikipedia_ingest_*` controls fallback DB-row insertion when scraping
#   returns little/no stamp data.
#
# Typical setups:
# - Scrape-only (fast/minimal): fetch=false, include=false
# - Enriched pages           : fetch=true,  include=true
# - Fallback assist only     : fetch=true,  include=false, ingest_enable=true
#
# Note: network fetch may slow generation on first run; cached content reduces
#       repeated fetch cost on later runs.

# When true, attempt to fetch/cache Wikipedia content during generation
fetch_wikipedia = false
# When true, include fetched Wikipedia paragraphs/sections in output pages
include_wikipedia_content = false
# SQLite cache file for fetched Wikipedia snippets/articles
# - Relative path is resolved from runtime working directory
# - You may use an absolute path if you want a shared cache location
wikipedia_cache_db_path = "wikipedia_cache.db"
# When true, insert fallback rows into album DB when scrape has no hits
# (or too few useful rows), using Wikipedia-derived metadata
wikipedia_ingest_enable = true
# Maximum number of fallback ingest rows inserted per run
# Typical range: 5..30 (lower = safer/manual, higher = more auto-fill)
wikipedia_ingest_max_entries = 12
# Series label prefix applied to ingested fallback rows
# Example output series: "Wikipedia import - Postal history"
wikipedia_ingest_series_prefix = "Wikipedia import"
# Behavior for grouped/range-like stamp references:
# - placeholders: keep compact placeholders for grouped ranges (default)
# - expand      : expand grouped ranges into individual row candidates
# - keep        : preserve grouped source form as-is
expand_grouped_ranges = "placeholders"

###################################
# Wikipedia
###################################
[wikipedia]
# Wikipedia page rendering controls (applies when Wikipedia content is included)
#
# Tuning workflow (recommended):
# 1) Set fonts/sizes for readability.
# 2) Adjust paragraph padding + spacing.
# 3) Pick pagination strategy.
# 4) Optionally enable centering/math spacing tweaks.

# Base font for high-level Wikipedia content blocks
# NOTE: content_wiki_font and content_wiki_font_size are legacy fields
# superseded by wikipedia_paragraph_font and wikipedia_paragraph_font_size
# below.  They are accepted for backward compatibility but are NOT read
# by the rendering pipeline — update wikipedia_paragraph_font instead.
content_wiki_font = "HN"
# Base size (points) for content-level text
content_wiki_font_size = 12

# Body paragraph font and size (points)
wikipedia_paragraph_font = "HN"
wikipedia_paragraph_font_size = 11

# Paragraph alignment options: JUSTIFIED | LEFT | RIGHT | CENTER
wikipedia_paragraph_alignment = "JUSTIFIED"

# Left and right inner paragraph padding (mm)
# Typical range: 4.0 .. 12.0
wikipedia_paragraph_padding = 8.0
# Left padding (mm) for Wikipedia paragraphs
wikipedia_paragraph_left_padding = 8.0
# Right padding (mm) for Wikipedia paragraphs
wikipedia_paragraph_right_padding = 8.0

# Paragraph vertical spacing (mm). Controls the gap between paragraphs.
# Typical range: 1.0 .. 3.5
# Lower = denser text, higher = more breathing room
wikipedia_paragraph_vspace = 2.0

# Section title font/size and spacing
wikipedia_section_title_font = "HB"
# Section title font size (points)
wikipedia_section_title_font_size = 13
# Gap after section title before paragraph text (mm)
wikipedia_section_title_spacing = 4.0

# Pagination strategy:
# - balanced     : packs content efficiently while keeping reasonable spacing
# - conservative : leaves extra safety space to reduce overflow risk
wikipedia_pagination_strategy = "balanced"

# Conservative-mode free-space fraction kept on each page
# Typical range: 0.70 .. 0.90
# Higher value = more free space, fewer paragraphs per page
wikipedia_pagination_conservative_fraction = 0.80

# Center the Wikipedia text block horizontally within available content area
wikipedia_center_content = false

# Add wider spacing around inline math-like fragments/symbols
# Helpful for readability in mixed text/math passages
wikipedia_use_math_spacing = true

###################################
# Image / DPI
###################################
[images]
# Image and DPI settings are critical because they control how pixel-based
# source images are translated into real-world print dimensions (mm/inches).
# If these values are mis-tuned, stamps can look too large/small, rows may
# overflow page bounds, and placeholder boxes can drift from real image sizes.

# Target DPI used in rendering math and dimension conversions.
# Why important:
# - DPI is the bridge between pixels and physical print size.
# - A stable DPI keeps generated AlbumEasy layout consistent across systems.
# - Changing this can affect computed stamp/image dimensions and pagination.
force_dpi = 96.0

# If true, keep real measured dimensions when available.
# sizing_mode: "real_world" emits physical DPI-derived sizes as-is.
# "fit_box" clamps stamp height to target_stamp_height_mm.
# Keep fit_box here so fresh installs do not render StampWorld imports oversized.
sizing_mode = "fit_box"

# Rebuild placeholder image files if sizing changes.
# Why important:
# - Prevents stale placeholders from masking updated sizing logic.
# - Keeps fallback visuals aligned with current layout calculations.
# - Especially useful while tuning dimensions or after changing DPI/offsets.
placeholder_always_overwrite = true

###################################
# Text Rendering Templates / Fallbacks
###################################
[text_templates]
# This section controls how reusable text macros are emitted into AlbumEasy
# commands (font, size, alignment, and vertical spacing behavior).
#
# Why this section is important:
# - Keeps typography consistent across page labels and metadata lines.
# - Allows global style tuning without changing generator code.
# - Helps avoid layout drift when switching fonts/sizes between systems.
#
# Tuning workflow (recommended):
# 1) Adjust the format templates only if you need custom AlbumEasy syntax.
# 2) Tune fallback font/size/vspace values for readability and spacing.
# 3) Tune specialized templates (series/date/watermark/engraving) last.
#
# CORE FORMAT TEMPLATES
# These are full template strings used when explicit formatted output is needed.
# Requirement: each template must include exactly one "{}" placeholder.
# The placeholder is replaced with generated text content at runtime.
#
# Why important:
# - Wrong syntax or missing placeholder can break text emission.
# - This is the highest-control override layer for page text rendering.
page_text_format = 'PAGE_TEXT (HN 10 "{}" 1.0)'
# Specialized templates for centered  text
page_text_centre_format = 'PAGE_TEXT_CENTRE (TN 8 "{}" 1.0)'
# Specialized templates for right-aligned text
page_text_right_format = 'PAGE_TEXT_RIGHT (HN 10 "{}" 1.0)'

# BASE FALLBACKS (GENERAL PAGE TEXT)
# Used when a full format template is not explicitly overridden.
#
# Why important:
# - Acts as safe defaults for consistent output.
# - Simplifies style changes (adjust once, apply in many places).
page_text_font = "HN"
# Base font size (points) for generic page text
# Typical range: 8.0 .. 12.0
page_text_size = 10.0
# Base vertical spacing (mm) for generic page text
# Typical range: 0.5 .. 2.0
page_text_vspace = 1.0

# CENTER TEXT FALLBACKS (GENERIC)
# Default centered text style for non-specialized centered lines.
# Center font
# font token for generic centered text (for example HN, HB, TN)
page_text_centre_font = "HN"
# Base font size (points) for generic centered text
# Typical range: 8.0 .. 12.0
page_text_centre_size = 8.0
# Base vertical spacing (mm) for generic centered text
# Typical range: 0.5 .. 2.0
page_text_centre_vspace = 1.0

# SPECIALIZED CENTER TEXT FALLBACKS
# These allow independent styling for specific metadata classes.
# Keep these aligned unless you intentionally want visual differentiation.

# Series line centered text (for series labels/headings)
# font token for series-centered text (for example HN, HB, TN)
series_page_text_centre_font = "HN"
# Base font size (points) for series-centered text
# Typical range: 8.0 .. 12.0
series_page_text_centre_size = 8.0
# Base vertical spacing (mm) for series-centered text
# Typical range: 0.5 .. 2.0
series_page_text_centre_vspace = 1.0

# Date line centered text
# font token for date-centered text (for example HN, HB, TN)
date_page_text_centre_font = "TN"
# Base font size (points) for date-centered text
date_page_text_centre_size = 8.0
# Base vertical spacing (mm) for date-centered text
date_page_text_centre_vspace = 1.0

# Watermark line centered text
# font token for watermark-centered text (for example HN, HB, TN)
# Base font size (points) for watermark-centered text
# Typical range: 8.0 .. 12.0
# Base vertical spacing (mm) for watermark-centered text
# Typical range: 0.5 .. 2.0
watermark_page_text_centre_font = "TN"
# Base font size (points) for watermark-centered text
# Typical range: 8.0 .. 12.0
watermark_page_text_centre_size = 8.0
# Base vertical spacing (mm) for watermark-centered text
# Typical range: 0.5 .. 2.0
watermark_page_text_centre_vspace = 1.0

# Engraving line centered text
# font token for engraving-centered text (for example HN, HB, TN)
# Base font size (points) for engraving-centered text
# Typical range: 8.0 .. 12.0
# Base vertical spacing (mm) for engraving-centered text
# Typical range: 0.5 .. 2.0
engraving_page_text_centre_font = "TN"
# Base font size (points) for engraving-centered text
# Typical range: 8.0 .. 12.0
engraving_page_text_centre_size = 8.0
# Base vertical spacing (mm) for engraving-centered text
# Typical range: 0.5 .. 2.0
# The engraving-specific vertical spacing is applied when generating
# PAGE_TEXT_CENTRE output, unless engraving_page_text_centre_format is set.
# In that case, the complete custom format takes precedence.
engraving_page_text_centre_vspace = 1.0

# RIGHT-ALIGNED TEXT FALLBACKS
# Used for right-anchored page labels/metadata when no full right template
# override is provided.
# font token for generic right-aligned text (for example HN, HB, TN)
page_text_right_font = "HN"
# Base font size (points) for generic right-aligned text
# Typical range: 8.0 .. 12.0
page_text_right_size = 10.0
# Base vertical spacing (mm) for generic right-aligned text
# Typical range: 0.5 .. 2.0
page_text_right_vspace = 1.0

# PER-TYPE FORMAT OVERRIDES
# Each *_format_enabled switch defaults to false. When true, its matching
# format string replaces the generated font/size/vspace fallback for that
# metadata category. When false, the category-specific font/size/vspace
# settings above remain in effect.
# Format strings must contain exactly one "{}" placeholder for the text.
# When true, use the custom format below for series-name header lines.
# When false, use the series font/size/vspace fallback settings.
series_page_text_centre_format_enabled = false
# Custom AlbumEasy PAGE_TEXT_CENTRE command for series-name header lines.
# Keep exactly one "{}" placeholder; it is replaced with the series name.
series_page_text_centre_format = 'PAGE_TEXT_CENTRE (HB 9 "{}" 1.0)'
# When true, use the custom format below for date header lines.
# When false, use the date font/size/vspace fallback settings.
date_page_text_centre_format_enabled = false
# Custom AlbumEasy PAGE_TEXT_CENTRE command for date header lines.
# Keep exactly one "{}" placeholder; it is replaced with the formatted date.
date_page_text_centre_format = 'PAGE_TEXT_CENTRE (TN 8 "{}" 1.0)'
# When true, use the custom format below for watermark header lines.
# When false, use the watermark font/size/vspace fallback settings.
watermark_page_text_centre_format_enabled = false
# Custom AlbumEasy PAGE_TEXT_CENTRE command for watermark header lines.
# Keep exactly one "{}" placeholder; it is replaced with the watermark text.
watermark_page_text_centre_format = 'PAGE_TEXT_CENTRE (TN 8 "{}" 1.0)'
# When true, use the custom format below for engraving header lines.
# When false, use the engraving font/size/vspace fallback settings.
engraving_page_text_centre_format_enabled = false
# Custom AlbumEasy PAGE_TEXT_CENTRE command for engraving header lines.
# Keep exactly one "{}" placeholder; it is replaced with the engraving text.
engraving_page_text_centre_format = 'PAGE_TEXT_CENTRE (TN 8 "{}" 1.0)'

###################################
# Header Formatting
###################################
[header_formatting]
# Fine-grained controls for how stamp-group headers are formatted.
# These fields live in a separate sub-section and are NOT promoted to the
# top-level config — they must be set here in [header_formatting].

# Date display settings for stamp issue dates shown in group headers.
# `date_pattern` is preferred for new configurations and takes precedence
# over the legacy `date_format` option below. It may contain these tokens:
#   {year}      four-digit year, such as "1960"
#   {month}     month name from the source, or a name derived from month_num
#   {month_num} numeric month from "1" through "12"
#   {day}       day of month, such as "15"
# Any punctuation, spacing, and token order may be chosen. Examples:
#   "{month} {day}, {year}" -> "January 15, 1960"
#   "{month_num}-{day}-{year}" -> "1-15-1960"
#   "{year}-{month_num}-{day}" -> "1960-1-15"
# If date_pattern is omitted, the legacy styles remain available:
#   "commas" (default) : "Month Day, Year"
#   "dashes"           : "Month - Day - Year"
date_pattern = "{month} {day}, {year}"
date_format = "commas"

###################################
# Diagnostics / Advanced
###################################
[diagnostics]
# These options are off by default and are intended for debugging layout and
# rendering issues.  Enabling them adds verbose output to the generated album
# files and/or the terminal log.

# Emit per-stamp PAGE_FIT diagnostics for every stamp placed on a page.
# Useful when stamps are being cut off or rows overflow unexpectedly.
# detailed_page_fit is a short alias; detailed_page_fit_diagnostics is the
# canonical name — both control the same feature.
detailed_page_fit = false
# Detailed diagnostics for every stamp placement decision, including row height
# calculations, image/text sizing, and overflow checks.  This is a more verbose
# version of detailed_page_fit and is intended for deep debugging of layout issues.
detailed_page_fit_diagnostics = false

# Emit extra diagnostics for placeholder expansion steps.
# Helps trace which placeholder tokens are resolved vs left unexpanded.
emit_placeholder_diagnostics = false

# Path to a DPI calibration CSV file.
# When set, calibration data from this file is loaded to fine-tune DPI
# calculations for your specific printer/output environment.
# Leave empty to skip calibration.
calibration_csv = ""

###################################
# Runtime / Integration Settings
###################################
[runtime]
# This section controls how the generator behaves at startup and integrates
# with external tools (AlbumEasy PDF renderer) and the Review UI.
#
# Why this section is important:
# - Determines where the generator looks for input data (Colnect inbox).
# - Controls AlbumEasy integration so PDFs can be built automatically.
# - Allows the Review UI to locate the correct Albums root across different
#   install locations (especially relevant on Windows with external runtime).
#
# Typical setup steps:
# 1) If using Colnect export, set colnect_inbox_path to your inbox folder.
# 2) Set albumeasy_cli_path if AlbumEasy is installed (enables PDF generation).
# 3) Set bootstrap_albums_root_path if auto-detection picks the wrong folder.
# 4) Optionally enable pdf_dx_logging for troubleshooting PDF failures.

# Show animated progress spinner/messages in terminal runs.
# Set false to suppress noise in automated/CI environments.
show_progress_indicator = true

# Directory scanned for Colnect export CSV files when using:
# --source colnectexport (without an explicit --colnect-inbox argument).
#
# Why important:
# - Without this, the generator has no default place to look for export files.
# - The directory is auto-created on first startup if it does not exist.
# - Relative paths are resolved from the runtime working directory.
colnect_inbox_path = "colnect_inbox"

# Path to the AlbumEasy CLI executable for post-generation PDF rendering.
# Leave empty to disable automatic PDF rendering (manual AlbumEasy use only).
#
# Why important:
# - When set along with albumeasy_auto_generate_pdf = true, the generator
#   will call AlbumEasy automatically after each album .txt file is written.
# - Must be the exact path to the executable on your system.
#
# Linux example:
#   albumeasy_cli_path = "/path/to/AlbumEasy/AlbumEasy.sh"
# Windows examples (TOML escaping required for backslashes):
#   Single-quoted (no escaping needed):
#     albumeasy_cli_path = 'C:\Program Files (x86)\AlbumEasy\AlbumEasy.exe'
#   Double-quoted (escape each backslash with \\):
#     albumeasy_cli_path = "C:\\Program Files (x86)\\AlbumEasy\\AlbumEasy.exe"
albumeasy_cli_path = ""

# Optional override for the Albums root directory used by the Review UI at startup.
#
# Why important:
# - The generator normally auto-detects the Albums root from the executable or
#   working directory location. This can fail when the executable is installed
#   in a different folder from the Albums data (e.g. external runtime on Windows).
# - Set this to either:
#   a) The Albums directory itself  (e.g. "E:\user\Documents\Stampgen\Albums")
#   b) A parent folder containing Albums (e.g. "E:\user\Documents\Stampgen")
# - Leave empty to rely on automatic detection.
bootstrap_albums_root_path = ""

# When true, automatically call AlbumEasy after each .txt file is generated.
# Requires albumeasy_cli_path to be set to a valid executable.
# Equivalent to running: <albumeasy_cli_path> -c <generated_txt>
albumeasy_auto_generate_pdf = false

# Maximum wait for a fresh PDF after the AlbumEasy launcher exits.
# Positive seconds; increase for large albums or slower storage.
albumeasy_pdf_timeout_secs = 300

# Enable additional PDF generation diagnostics written to the Logs/ directory.
#
# Why important:
# - Useful when PDFs fail silently, images do not appear, or AlbumEasy exits
#   with errors that are hard to trace from terminal output alone.
# - Keep false in normal use; set true only when troubleshooting PDF issues.
pdf_dx_logging = false

###################################
# Review UI / Stamp Browser Settings
###################################
[review_ui]
# This section configures the built-in web-based stamp browser and review tool.
#
# Why this section is important:
