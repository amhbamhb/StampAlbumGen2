# Stamp Album Generator Configuration File
#
# Edit this file to customize the output layout, sizing, and other options for AlbumEasy generation.
# All values are optional; defaults will be used if not specified.
#
# --- Stamp Box Sizing ---
# Height of each stamp box in millimeters
stamp_box_height = 24.0

# --- Row Font Spacing ---
# Vertical spacing between rows of stamps (mm)
row_font_spacing = 5.0

# --- Header Font Spacing ---
# Vertical spacing for header text (mm)
header_font_spacing = 3.0

# --- Reference Page Size ---
# Reference width of the album page (mm)
reference_width_mm = 200.0
# Reference height of the album page (mm)
reference_height_mm = 240.0

# --- Additional Options ---
# Add more configuration options below as needed.
# For example:
# margin_top_mm = 10.0
# margin_bottom_mm = 10.0
# font_family = "Arial"
# debug_mode = false

# --- Stamp Box Adjustment ---
# Amount of extra space (mm) to add around each stamp as a border.
# This value is applied per-side when computing box size, i.e. the emitted
# box width = measured_width + 2 * stamp_box_adjust. Typical values: 2.0 - 4.0
stamp_box_adjust = 3.0

# When true the generator will emit detailed per-stamp PAGE_FIT diagnostics
# into the generated AlbumEasy text output. This is verbose and intended only
# for debugging layout/fit issues. Default: false
detailed_page_fit_diagnostics = false

# Conservative buffer (mm) reserved at the bottom of each page to avoid
# overlapping AlbumEasy footers or page decorations. Increase if you observe
# content bleeding into the footer. Default: 11.0
page_fit_conservative_buffer_mm = 11.0

# Example: adjust the conservative buffer to tune page breaks
#
# The generator subtracts this buffer from the usable page height when
# determining whether a header+row will fit on the current page. If you
# generate AlbumEasy content using page size 216x279.4 mm (e.g. A4-like), the
# global AlbumEasy header emitted by the generator looks like:
#
#   ALBUM_PAGES_SIZE  (216.0 279.4) # Page size in mm (width height)
#
# If the generator estimates a header+row + buffer would exceed the usable
# height, it will start a new page instead of allowing the row to be emitted
# near the bottom (which can visually overlap the footer). Example commented
# setting to add to your `config.toml`:
#
# page_fit_conservative_buffer_mm = 11.0  # reserve 11 mm at page bottom (default)
#
# Tuning tips:
# - If you still see footer overlap in the rendered PDF, increase by +0.5 or
#   +1.0 mm until the overlap disappears.
# - If you want a slightly denser layout, reduce it in small steps.

# --- Per-series packing thresholds ---
# If the median measured stamp+box width for a series is >= median_width_cap_3
# the generator will cap stamps-per-row to 3. If median >= median_width_cap_4 it
# will cap to 4. These are useful to force wide stamps to occupy fewer columns.
median_width_cap_3 = 36.0
median_width_cap_4 = 30.0

# --- Flag cover ---
# If false, the generator will not attempt to download/copy a country flag or
# emit the large flag/title cover page. Defaults to true when omitted.
# print_flag_cover = true

# --- Slug overrides for StampWorld ---
# Map your local `--site-name` to a canonical StampWorld slug when needed.
# Example:
# [slug_overrides]
# "British-ColumbiaIsland" = "British-Columbia!Vancouver-Island"

# --- Album pages and header/footer tuning ---
# Controls for AlbumEasy header/footer, title font, and footer numbering.
# These are optional; the generator will use sensible defaults when omitted.
# album_pages_title_font = "Helvetica-Bold"
# album_pages_title_size = 16.0
# album_pages_header_position = "centre" # or "left", "right"
# album_pages_footer_number_enabled = true

# --- ROW_START_ES formatting (optional) ---
# Controls the small line printed at the start of rows for certain albums.
# When enabled, these values control the emitted font, size, spacing and
# vertical spacing used for the ROW_START_ES block. If unset sensible
# defaults are used that match the previous hard-coded behavior.
# row_start_es_enabled = true
# row_start_es_font = "Helvetica"
# row_start_es_size = 8.0
# row_start_es_spacing = 1.0
# row_start_es_vspace = 2.0

# --- Flag cover rendering hints (flag_cover_*) ---
# These fields provide per-flag/cover rendering hints used when the
# optional large cover page is emitted. Keys are optional and are
# intentionally conservative — the generator will fall back to
# previous hard-coded values when these are not present.
#
# Values are applied as millimeters for sizing and spacing, or strings for
# font names. Example settings:
# flag_cover_img_w_mm = 120.0
# flag_cover_img_h_mm = 60.0
# flag_cover_page_vspace_top = 18.0
# flag_cover_image_vspace_after = 8.0
# flag_cover_image_title_font = "Helvetica-Bold"
# flag_cover_image_title_size = 36.0
# flag_cover_text_only_vspace_top = 24.0
# flag_cover_text_only_title_font = "Helvetica-Bold"
# flag_cover_text_only_title_size = 40.0
