[package]
name = "stamp_album_globals"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.2"
image = { version = "0.25.10", features = ["png"] }
ab_glyph = "0.2"
scraper = "0.26.0"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
lazy_static = "1.5.0"
regex = "1.10"
rusqlite = "0.39.0"
log = "0.4"
stamp_album_db = { path = "../stamp_album_db" }
env_logger = "0.11.10"
flexi_logger = "0.31.8"
indicatif = "0.18"
toml = "1.1.1"
serde = "1.0.219"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
whoami = "2.1.1"
sha2 = "0.11.0"
tempfile = { version = "3.6", optional = false }

once_cell = "1.21.3"
strsim = "0.11.1"