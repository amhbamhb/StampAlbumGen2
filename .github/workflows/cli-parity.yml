name: CLI parity test

on:
  pull_request:
    paths:
      - '**/*.rs'
      - 'scripts/**'
      - 'Example-Stampworldwebpage.txt'
      - 'scripts/populate_example_db.data.json'

jobs:
  parity:
    name: Run CLI parity test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Build
        run: cargo build --locked
      - name: Make scripts executable
        run: |
          chmod +x scripts/cli_parity_test.sh
          chmod +x scripts/populate_example_db.sh
          chmod +x scripts/populate_example_db.py || true
      - name: Run parity test
        run: ./scripts/cli_parity_test.sh --verbose
        env:
          RUST_BACKTRACE: 1
