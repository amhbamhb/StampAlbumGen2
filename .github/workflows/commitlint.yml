name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install commitlint
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Run commitlint on PR commits
        run: |
          # Ensure repository history is available
          git fetch --no-tags --prune || true
          # Check the latest PR commit without rejecting pre-existing history
          npx commitlint --from=${{ github.event.pull_request.head.sha }}^ --to=${{ github.event.pull_request.head.sha }} --config ./.commitlintrc.json
        env:
          CI: true
