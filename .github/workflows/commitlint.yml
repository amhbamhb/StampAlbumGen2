name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run commitlint on PR commits
        uses: wagoid/commitlint-github-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
