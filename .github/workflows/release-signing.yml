name: Build, Sign and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build artifacts (Windows/Linux/macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/setup-rust@v1
      - name: Build release
        run: |
          cargo build --release
      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path target\release\stamp_album_gen2.exe) { Move-Item -Path target\release\stamp_album_gen2.exe -Destination stamp_album_gen2-windows.exe } else { Write-Host 'Windows artifact not found'; exit 1 }

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stamp_artifact-windows-latest
          path: stamp_album_gen2-windows.exe

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f target/release/stamp_album_gen2 ]; then mv target/release/stamp_album_gen2 stamp_album_gen2-linux; else echo "Linux artifact not found"; exit 1; fi

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stamp_artifact-ubuntu-latest
          path: stamp_album_gen2-linux

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -f target/release/stamp_album_gen2 ]; then mv target/release/stamp_album_gen2 stamp_album_gen2-macos; else echo "macOS artifact not found"; exit 1; fi

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stamp_artifact-macos-latest
          path: stamp_album_gen2-macos

  windows-sign:
    name: Sign Windows EXE (Authenticode)
    runs-on: windows-latest
    needs: build
    # Do not reference `secrets` in a job-level `if` expression (can cause parser errors).
    # Instead check for the secret at runtime in a step and exit the job early if missing.
    steps:
      - name: Check signing PFX secret
        shell: pwsh
        run: |
          if (-not $env:SIGNING_PFX) {
            Write-Host 'SIGNING_PFX not set - skipping signing job'
            exit 0
          }
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: stamp_artifact-windows-latest

      - name: Decode signing PFX (PowerShell)
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        run: |
          if (-not $env:SIGNING_PFX) { Write-Host 'No SIGNING_PFX provided'; exit 1 }
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:SIGNING_PFX))

      - name: Sign EXE with SignTool
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path cert.pfx)) { Write-Host 'cert.pfx missing'; exit 1 }
          if (-not (Test-Path 'stamp_album_gen2-windows.exe')) { Write-Host 'stamp_album_gen2-windows.exe not found'; exit 1 }
          signtool sign /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /f cert.pfx /p $env:SIGNING_PFX_PASSWORD stamp_album_gen2-windows.exe

      - name: Upload signed windows exe
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-exe
          path: stamp_album_gen2-windows.exe

  sign-and-release:
    name: Create checksums, signatures and GitHub release
    needs: [build, windows-sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: stamp_artifact-ubuntu-latest
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: stamp_artifact-macos-latest
      - name: Download signed windows artifact (if present)
        uses: actions/download-artifact@v4
        with:
          name: signed-windows-exe
        continue-on-error: true
      - name: Normalize filenames
        run: |
          if [ -f stamp_album_gen2-windows.exe ]; then mv stamp_album_gen2-windows.exe stamp_album_gen2-windows.exe; fi
          if [ -f stamp_album_gen2-linux ]; then mv stamp_album_gen2-linux stamp_album_gen2-linux; fi
          if [ -f stamp_album_gen2-macos ]; then mv stamp_album_gen2-macos stamp_album_gen2-macos; fi
      - name: Compute SHA256 for each artifact
        run: |
          for f in stamp_album_gen2-*; do sha256sum "$f" > "$f.sha256"; done
      - name: Comment workflow run to PR (if applicable)
        if: ${{ github.event.pull_request != null }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Release workflow started: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Artifacts and signatures will be uploaded when the run completes.
      - name: Install cosign (for keyless signing)
        run: |
          COSIGN_VER=v2.1.0
          curl -sSfL https://github.com/sigstore/cosign/releases/download/${COSIGN_VER}/cosign-linux-amd64 -o cosign
          chmod +x cosign
          mv cosign /usr/local/bin/
      - name: Cosign keyless sign artifacts
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${COSIGN_KEY:-}" ]; then
            echo "COSIGN_KEY provided; skipping keyless signing"
            exit 0
          fi
          for f in stamp_album_gen2-*; do
            sigfile="$f.sig"
            cosign sign-blob --keyless --output-signature "$sigfile" "$f"
            cosign verify-blob --keyless --signature "$sigfile" "$f"
          done
      - name: Import GPG signing key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_KEY:-}" ]; then
            echo "No GPG_PRIVATE_KEY provided; skipping import"
            exit 0
          fi
          echo "$GPG_KEY" | base64 -d > private.key
          gpg --batch --import private.key
      - name: Create GPG detached signatures
        run: |
          if ! gpg --list-secret-keys >/dev/null 2>&1; then
            echo "No GPG key imported; skipping GPG signatures"
            exit 0
          fi
          for f in stamp_album_gen2-*; do gpg --batch --yes --armor --detach-sign "$f" || true; done
      - name: Cosign sign blobs (optional)
        env:
          COSIGN_KEY_B64: ${{ secrets.COSIGN_KEY }}
        run: |
          if [ -z "${COSIGN_KEY_B64:-}" ]; then
            echo "No COSIGN_KEY provided; skipping cosign key-based signing"
            exit 0
          fi
          echo "$COSIGN_KEY_B64" | base64 -d > cosign.key
          chmod 600 cosign.key
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign
          chmod +x cosign
          for f in stamp_album_gen2-*; do ./cosign sign-blob --key cosign.key "$f" || true; done
      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            stamp_album_gen2-windows.exe
            stamp_album_gen2-windows.exe.sha256
            stamp_album_gen2-windows.exe.asc
            stamp_album_gen2-windows.exe.sig
            stamp_album_gen2-linux
            stamp_album_gen2-linux.sha256
            stamp_album_gen2-linux.asc
            stamp_album_gen2-linux.sig
            stamp_album_gen2-macos
            stamp_album_gen2-macos.sha256
            stamp_album_gen2-macos.asc
            stamp_album_gen2-macos.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}