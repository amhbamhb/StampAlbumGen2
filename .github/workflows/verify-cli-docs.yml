name: Verify CLI docs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-cli-docs:
    name: Verify CLI docs match generated help
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --features rfd

      - name: Capture CLI help
        run: cargo run --features rfd -- --help > help.txt

      - name: Compare help to docs/CLI_USAGE.md (normalize trailing newlines)
        run: |
          set -euo pipefail
          # Normalize both files to use LF and a single trailing newline before diffing.
          normalize() {
            perl -0777 -pe 's/\r\n?/\n/g; s/\n+\z/\n/;' "$1" > "$2"
          }
          normalize docs/CLI_USAGE.md docs/CLI_USAGE.normalized
          normalize help.txt help.normalized
          if ! diff -u docs/CLI_USAGE.normalized help.normalized; then
            echo "CLI docs (docs/CLI_USAGE.md) are out of date. Regenerate locally using:"
            echo "  cargo run -- --help > docs/CLI_USAGE.md"
            exit 1
          fi
      # commitlint workflow enforces Conventional Commits on PRs
