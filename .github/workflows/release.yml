name: Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      RUSTFLAGS: -C lto=off -C codegen-units=16

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Show disk usage and cleanup large files (early)
      if: runner.os == 'Linux'
      run: |
        echo "Disk usage before cleanup:"; df -h || true
        echo "Workspace size:"; du -sh "$GITHUB_WORKSPACE" || true
        if [ -f perf.data ]; then
          echo "Removing workspace perf.data to free space";
          rm -f perf.data || true
        fi
        find "$GITHUB_WORKSPACE" -type f -size +200M -maxdepth 3 -print -exec rm -f {} \; || true
        echo "Disk usage after early cleanup:"; df -h || true
      shell: bash

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Get current version
      id: current_version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        echo "current_version=$VERSION" >> $GITHUB_OUTPUT

    - name: Determine version bump type
      id: version_type
      run: |
        if [ "${{ github.event.inputs.version_type }}" != "" ]; then
          echo "version_type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
        else
          # Auto-detect from conventional commits
          if git log --oneline -n 20 | grep -q "feat:"; then
            echo "version_type=minor" >> $GITHUB_OUTPUT
          elif git log --oneline -n 20 | grep -q "fix:"; then
            echo "version_type=patch" >> $GITHUB_OUTPUT
          elif git log --oneline -n 20 | grep -q "BREAKING CHANGE"; then
            echo "version_type=major" >> $GITHUB_OUTPUT
          else
            echo "version_type=patch" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Calculate new version
      id: new_version
      run: |
        CURRENT="${{ steps.current_version.outputs.current_version }}"
        TYPE="${{ steps.version_type.outputs.version_type }}"

        # Parse version components
        MAJOR=$(echo $CURRENT | cut -d. -f1)
        MINOR=$(echo $CURRENT | cut -d. -f2)
        PATCH=$(echo $CURRENT | cut -d. -f3)

        case $TYPE in
          "major")
            NEW_VERSION="$((MAJOR + 1)).0.0"
            ;;
          "minor")
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
            ;;
          "patch")
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            ;;
        esac

        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Calculated new version: $CURRENT -> $NEW_VERSION (type: $TYPE)"

    - name: Update version in files
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
        DATE=$(date +%Y-%m-%d)

        echo "Updating version to $NEW_VERSION..."

        # Update Cargo.toml
        sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml

        # Update instructions
        sed -i "s/^# Version: .*/# Version: $NEW_VERSION/" .github/instructions
        sed -i "s/^# Last Updated: .*/# Last Updated: $DATE/" .github/instructions

        # Update README
        sed -i "s/^# Stamp Album Generator v.*/# Stamp Album Generator v$NEW_VERSION/" README.md
        sed -i "s/<!-- Version: .* | Last Updated: .* | Previous:/<!-- Version: $NEW_VERSION | Last Updated: $DATE | Previous:/" README.md
        sed -i "s/^\*\*Version\*\*: .*/**Version**: $NEW_VERSION/" README.md
        sed -i "s/^\*\*Release Date\*\*: .*/**Release Date**: $DATE/" README.md

        # Update RELEASE_NOTES
        sed -i "s/^# Stamp Album Generator v.*/# Stamp Album Generator v$NEW_VERSION Release Notes/" RELEASE_NOTES.md
        sed -i "s/^\*\*Version\*\*: .*/**Version**: $NEW_VERSION/" RELEASE_NOTES.md
        sed -i "s/^\*\*Release Date\*\*: .*/**Release Date**: $DATE/" RELEASE_NOTES.md
    - name: Add temporary swap to avoid linker OOM
      if: runner.os == 'Linux'
      run: |
        echo "Attempting to create 6G swapfile in runner temp to avoid linker OOM"
        SWAPFILE="${RUNNER_TEMP:-/tmp}/gha_swapfile"
        echo "Swapfile path: $SWAPFILE"
        # If the swapfile is already active, nothing to do
        if sudo swapon --noheadings --show=NAME 2>/dev/null | awk '{print $1}' | grep -qx "$SWAPFILE"; then
          echo "Swap already active at $SWAPFILE"
          exit 0
        fi

        # Remove any stale swapfile at the path
        if [ -e "$SWAPFILE" ]; then
          echo "Existing swapfile found at $SWAPFILE; removing"
          sudo rm -f "$SWAPFILE" || true
        fi

        # Try to allocate with fallocate first; fall back to dd. Allow failures and continue.
        set +e
        if command -v fallocate >/dev/null 2>&1; then
          sudo fallocate -l 6G "$SWAPFILE" 2>/dev/null
        fi
        if [ ! -s "$SWAPFILE" ]; then
          sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=6144 status=none || true
        fi
        set -e

        sudo chmod 600 "$SWAPFILE" || true
        if ! sudo mkswap "$SWAPFILE" >/dev/null 2>&1; then
          echo "mkswap failed; continuing without swap (best-effort)"
          exit 0
        fi
        if ! sudo swapon "$SWAPFILE" >/dev/null 2>&1; then
          echo "swapon failed; continuing without swap (best-effort)"
          exit 0
        fi
        sudo sysctl -w vm.swappiness=10 || true
        echo "Swap added at $SWAPFILE"
      shell: bash

    # RUSTFLAGS and CARGO_TARGET_DIR are set at job-level env to ensure they are
    # present for every step (including cache/restore and any cargo invocations).

    - name: Build and test
      run: |
        cargo build --release
        cargo test

    # Early cleanup already handled; later cleanup intentionally omitted to avoid
    # removing files created by the build steps.

    # CARGO_TARGET_DIR is configured as a job-level env to ensure all steps
    # including cache and pre-build operations respect the target dir.

    - name: Verify version consistency
      run: |
        CARGO_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        INSTRUCTIONS_VERSION=$(grep '^# Version: ' .github/instructions | sed 's/# Version: \(.*\)/\1/')

        if [ "$CARGO_VERSION" != "$INSTRUCTIONS_VERSION" ]; then
          echo "Version mismatch! Cargo: $CARGO_VERSION, Instructions: $INSTRUCTIONS_VERSION"
          exit 1
        fi

        echo "✅ Version consistency verified: $CARGO_VERSION"

    - name: Commit version changes
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
        git add .
        git commit -m "chore: bump version to $NEW_VERSION" || echo "No changes to commit"

    - name: Create Git tag
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
        git tag "v$NEW_VERSION"

    - name: Push changes and tags
      run: |
        git push origin HEAD
        git push origin "v${{ steps.new_version.outputs.new_version }}"

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.new_version.outputs.new_version }}
        release_name: Release v${{ steps.new_version.outputs.new_version }}
        body: |
          ## What's Changed

          Automatic release created from commit messages.

          ### Version: ${{ steps.new_version.outputs.new_version }}
          ### Previous: ${{ steps.current_version.outputs.current_version }}
          ### Type: ${{ steps.version_type.outputs.version_type }}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.current_version.outputs.current_version }}...v${{ steps.new_version.outputs.new_version }}
        draft: false
        prerelease: false