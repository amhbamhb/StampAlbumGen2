name: Release (combined)
run-name: Release next ${{ inputs.version_type }} version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Increment from the highest package version or release tag. Version numbers and tags are automatic.'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: application-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare next version (no publication)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      tree_sha: ${{ steps.prepare.outputs.tree_sha }}
      reused_sha: ${{ steps.prepare.outputs.reused_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Require release from default branch
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::Select '$RELEASE_BRANCH' in 'Use workflow from'. Releases build the latest default-branch source."
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare versioned source
        id: prepare
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: bash scripts/prepare_release.sh

      - name: Upload exact version changes
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source/release-source.patch
          if-no-files-found: error
          overwrite: true

      - name: Summarize selected version
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: |
          echo "## Automatic release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Prepared from $BASE_SHA. Commit and tag publication waits for both platform tests/builds." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build artifacts (matrix)
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.base_sha }}
      - name: Download exact version changes
        uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Apply tested release source
        shell: bash
        env:
          TREE_SHA: ${{ needs.prepare-release.outputs.tree_sha }}
        run: |
          git apply --index "$RUNNER_TEMP/release-source/release-source.patch"
          test "$(git write-tree)" = "$TREE_SHA"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node for release regression tests
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test release automation
        if: matrix.os == 'ubuntu-latest'
        run: node --test tests/release_publication_shell.cjs tests/cli_workflows.test.cjs tests/cargo_targets.test.cjs

      - name: Test portable Linux release
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --workspace --lib --no-default-features --locked

      - name: Test Windows release with native dialogs
        if: matrix.os == 'windows-latest'
        run: cargo test --release --workspace --lib --features rfd --locked

      - name: Build portable Linux release
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --no-default-features --locked

      - name: Build Windows release with native dialogs
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features rfd --locked

      - name: Package artifact
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            "windows-latest") if [ -f target/release/stamp_album_gen2.exe ]; then mv target/release/stamp_album_gen2.exe stamp_album_gen2.exe; else echo 'Windows artifact not found' && exit 1; fi ;;
            "ubuntu-latest") if [ -f target/release/stamp_album_gen2 ]; then mv target/release/stamp_album_gen2 stamp_album_gen2; else echo 'Linux artifact not found' && exit 1; fi ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stamp_artifact-${{ matrix.os }}
          path: |
            stamp_album_gen2.exe
            stamp_album_gen2
          if-no-files-found: error
          overwrite: true

  windows-sign:
    name: Sign Windows EXE (Authenticode)
    needs: build
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing_pfx.outputs.enabled }}
    steps:
      - name: Check signing PFX secret
        id: signing_pfx
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        run: |
          if (-not $env:SIGNING_PFX) { Write-Host 'SIGNING_PFX not set - skipping signing job'; "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download Windows artifact
        if: steps.signing_pfx.outputs.enabled == 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          name: stamp_artifact-windows-latest

      - name: Decode signing PFX (PowerShell)
        if: steps.signing_pfx.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        run: |
          try {
            $b64 = $env:SIGNING_PFX -replace '\s', ''
            [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($b64))
          } catch { Write-Host "Failed to decode SIGNING_PFX: $($_.Exception.Message)"; exit 1 }

      - name: Validate PFX and password (pre-sign)
        if: steps.signing_pfx.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          try {
            if (-not (Test-Path 'cert.pfx')) { Write-Host 'cert.pfx missing after decode'; exit 1 }
            $pw = $env:SIGNING_PFX_PASSWORD
            if (-not $pw) { Write-Host 'SIGNING_PFX_PASSWORD not set'; exit 1 }
            # Import the PFX into an X509Certificate2 object and check for private key
            $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
            $bytes = [IO.File]::ReadAllBytes('cert.pfx')
            # Use the constructor on platforms where X509Certificate2 is immutable
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($bytes, $pw, $flags)
            if (-not $cert.HasPrivateKey) { Write-Host 'PFX decoded but contains no private key (HasPrivateKey=false)'; exit 1 }
            Write-Host "PFX validated (HasPrivateKey=$($cert.HasPrivateKey))"
          } catch { Write-Host "PFX validation failed: $($_.Exception.Message)"; exit 1 }

      - name: Sign EXE with SignTool
        if: steps.signing_pfx.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          try {
            if (-not (Test-Path cert.pfx)) { Write-Host 'cert.pfx missing'; exit 1 }
            if (-not (Test-Path 'stamp_album_gen2.exe')) { Write-Host 'stamp_album_gen2.exe not found'; exit 1 }
            $signtool = (Get-Command signtool -ErrorAction SilentlyContinue)?.Source
            if (-not $signtool) {
              $found = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits' -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $signtool = $found.FullName }
            }
            if (-not $signtool) { Write-Host 'signtool not found; aborting'; exit 1 }
            & "$signtool" sign /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /f cert.pfx /p "$env:SIGNING_PFX_PASSWORD" "stamp_album_gen2.exe"
            if ($LASTEXITCODE -ne 0) { throw "SignTool exited with code $LASTEXITCODE" }
          } catch { Write-Host "SignTool invocation failed: $($_.Exception.Message)"; exit 1 }

      - name: Upload signed windows exe
        if: steps.signing_pfx.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-exe
          path: stamp_album_gen2.exe
          if-no-files-found: error
          overwrite: true

  publish-source:
    name: Publish tested version commit and tag
    needs: [prepare-release, build, windows-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.base_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Atomically publish source and tag
        id: publish
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          BASE_SHA: ${{ needs.prepare-release.outputs.base_sha }}
          TREE_SHA: ${{ needs.prepare-release.outputs.tree_sha }}
          REUSED_SHA: ${{ needs.prepare-release.outputs.reused_sha }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish_release_source.sh

  finalize-release:
    name: Create checksums, signatures and GitHub release
    needs: [prepare-release, publish-source, windows-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-source.outputs.source_sha }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: stamp_artifact-ubuntu-latest


      - name: Download signed Windows artifact
        if: needs.windows-sign.outputs.signed == 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          name: signed-windows-exe
      - name: Download unsigned Windows artifact
        if: needs.windows-sign.outputs.signed != 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          name: stamp_artifact-windows-latest

      - name: Compute SHA256 for each artifact
        run: |
          for f in stamp_album_gen2.exe stamp_album_gen2; do
            test -s "$f"
            sha256sum "$f" > "$f.sha256"
          done
      - name: Package all binaries into a single archive
        run: |
          TAG="${{ needs.prepare-release.outputs.release_tag }}"
          ARCHIVE_NAME="stamp_album_gen2-${TAG}.tar.gz"
          # Artifact downloads reset file modes; restore the Linux executable.
          chmod 755 stamp_album_gen2
          tar -czf "$ARCHIVE_NAME" stamp_album_gen2.exe stamp_album_gen2.exe.sha256 stamp_album_gen2 stamp_album_gen2.sha256
          ls -lh "$ARCHIVE_NAME"
      - name: Upload assets and publish release (retry safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$status" in
            200)
              draft=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["draft"])' "$RUNNER_TEMP/release.json")
              if [ "$draft" = False ]; then
                echo "$TAG is already published; keeping its assets unchanged."
                exit 0
              fi
              ;;
            404) gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes ;;
            *) echo "Release lookup failed (HTTP $status)." >&2; exit 1 ;;
          esac
          gh release upload "$TAG" stamp_album_gen2.exe stamp_album_gen2.exe.sha256 \
            stamp_album_gen2 stamp_album_gen2.sha256 "stamp_album_gen2-${TAG}.tar.gz" --clobber
          gh release edit "$TAG" --draft=false
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
