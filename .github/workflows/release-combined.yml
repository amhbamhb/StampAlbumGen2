name: Release (combined)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to release (for example v1.14.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

# Note: `runner` expressions are only valid inside a job context. Set
# `CARGO_TARGET_DIR` and `RUSTFLAGS` at job level where `runner.temp` is
# available.

jobs:
  validate-release:
    name: Validate existing release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tag must have the form vX.Y.Z")
          resolved = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
              capture_output=True, text=True,
          )
          if resolved.returncode:
              raise SystemExit(f"Release tag {tag} does not exist or does not point to a commit")
          sha = resolved.stdout.strip()
          manifest = subprocess.check_output(["git", "show", f"{sha}:Cargo.toml"], text=True)
          version = tomllib.loads(manifest)["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match Cargo package version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={tag}\nsource_sha={sha}\n")
          print(f"Release {tag} will build existing commit {sha}; source files and tags are unchanged")
          PY

  build:
    name: Build artifacts (matrix)
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.source_sha }}
      # Optional defensive step: logs top disk users and removes very large files
      # Keep while debugging runner OOM/disk issues; safe to remove later.
      - name: Early disk usage diagnostics and cleanup (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Disk usage before cleanup:"; df -h || true
          echo "Top 50 largest files/dirs in workspace:"; du -xah "$GITHUB_WORKSPACE" 2>/dev/null | sort -hr | head -n 50 || true
          find "$GITHUB_WORKSPACE" -xdev -type f -size +200M -maxdepth 6 -ls || true
          if [ -f perf.data ]; then rm -f perf.data || true; fi
          find "$GITHUB_WORKSPACE" -xdev -type f -size +200M -maxdepth 6 -print -exec rm -f {} \; || true
        shell: bash

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install Linux build prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev

      - name: Build portable Linux release
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --no-default-features

      - name: Build Windows release with native dialogs
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features rfd

      - name: Package artifact
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            "windows-latest") if [ -f target/release/stamp_album_gen2.exe ]; then mv target/release/stamp_album_gen2.exe stamp_album_gen2.exe; else echo 'Windows artifact not found' && exit 1; fi ;;
            "ubuntu-latest") if [ -f target/release/stamp_album_gen2 ]; then mv target/release/stamp_album_gen2 stamp_album_gen2-linux; else echo 'Linux artifact not found' && exit 1; fi ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stamp_artifact-${{ matrix.os }}
          path: |
            stamp_album_gen2.exe
            stamp_album_gen2-linux

  windows-sign:
    name: Sign Windows EXE (Authenticode)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Set job env (CARGO_TARGET_DIR, RUSTFLAGS)
        shell: pwsh
        run: |
          echo "CARGO_TARGET_DIR=$env:RUNNER_TEMP\\cargo-target" >> $env:GITHUB_ENV
          echo "RUSTFLAGS=-C lto=off -C codegen-units=16" >> $env:GITHUB_ENV

      - name: Check signing PFX secret
        id: signing_pfx
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        run: |
          if (-not $env:SIGNING_PFX) { Write-Host 'SIGNING_PFX not set - skipping signing job'; "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download Windows artifact
        if: steps.signing_pfx.outputs.enabled == 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          name: stamp_artifact-windows-latest

      - name: Decode signing PFX (PowerShell)
        if: steps.signing_pfx.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        run: |
          try {
            $b64 = $env:SIGNING_PFX -replace '\s', ''
            [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($b64))
          } catch { Write-Host "Failed to decode SIGNING_PFX: $($_.Exception.Message)"; exit 1 }

      - name: Validate PFX and password (pre-sign)
        if: steps.signing_pfx.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          try {
            if (-not (Test-Path 'cert.pfx')) { Write-Host 'cert.pfx missing after decode'; exit 1 }
            $pw = $env:SIGNING_PFX_PASSWORD
            if (-not $pw) { Write-Host 'SIGNING_PFX_PASSWORD not set'; exit 1 }
            # Import the PFX into an X509Certificate2 object and check for private key
            $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
            $bytes = [IO.File]::ReadAllBytes('cert.pfx')
            # Use the constructor on platforms where X509Certificate2 is immutable
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($bytes, $pw, $flags)
            if (-not $cert.HasPrivateKey) { Write-Host 'PFX decoded but contains no private key (HasPrivateKey=false)'; exit 1 }
            Write-Host "PFX validated (HasPrivateKey=$($cert.HasPrivateKey))"
          } catch { Write-Host "PFX validation failed: $($_.Exception.Message)"; exit 1 }

      - name: Sign EXE with SignTool
        if: steps.signing_pfx.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          try {
            if (-not (Test-Path cert.pfx)) { Write-Host 'cert.pfx missing'; exit 1 }
            if (-not (Test-Path 'stamp_album_gen2.exe')) { Write-Host 'stamp_album_gen2.exe not found'; exit 1 }
            $signtool = (Get-Command signtool -ErrorAction SilentlyContinue)?.Source
            if (-not $signtool) {
              $found = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits' -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $signtool = $found.FullName }
            }
            if (-not $signtool) { Write-Host 'signtool not found; aborting'; exit 1 }
            & "$signtool" sign /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /f cert.pfx /p "$env:SIGNING_PFX_PASSWORD" "stamp_album_gen2.exe"
          } catch { Write-Host "SignTool invocation failed: $($_.Exception.Message)"; exit 1 }

      - name: Upload signed windows exe
        if: steps.signing_pfx.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-exe
          path: stamp_album_gen2.exe

  finalize-release:
    name: Create checksums, signatures and GitHub release
    needs: [validate-release, build, windows-sign]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set job env (CARGO_TARGET_DIR, RUSTFLAGS)
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C lto=off -C codegen-units=16" >> $GITHUB_ENV

      - name: Set job env (CARGO_TARGET_DIR, RUSTFLAGS)
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C lto=off -C codegen-units=16" >> $GITHUB_ENV

      - name: Download Linux artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: stamp_artifact-ubuntu-latest


      - name: Download signed windows artifact (if present)
        uses: actions/download-artifact@v4.1.3
        with:
          name: signed-windows-exe
        continue-on-error: true

      - name: Normalize filenames
        run: |
          # Only rename when an alternate source filename exists and the normalized target is missing.
          if [ -f stamp_album_gen2 ] && [ ! -f stamp_album_gen2-linux ]; then
            mv stamp_album_gen2 stamp_album_gen2-linux
          fi
          # macOS artifact disabled temporarily (no macOS certificate available)

      - name: Compute SHA256 for each artifact
        run: |
          for f in stamp_album_gen2.exe stamp_album_gen2-linux; do
            if [ -f "$f" ]; then sha256sum "$f" > "$f.sha256"; fi
          done
      - name: Package all binaries into a single archive
        run: |
          TAG="${{ needs.validate-release.outputs.release_tag }}"
          ARCHIVE_NAME="stamp_album_gen2-${TAG}.tar.gz"
          # include binaries and their sha256 files
          artifacts=(stamp_album_gen2.exe stamp_album_gen2.exe.sha256 stamp_album_gen2-linux stamp_album_gen2-linux.sha256)
          files=()
          for f in "${artifacts[@]}"; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          tar -czf "$ARCHIVE_NAME" "${files[@]}"
          ls -lh "$ARCHIVE_NAME"
      - name: Create GitHub Release (draft) and upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-release.outputs.release_tag }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            stamp_album_gen2.exe
            stamp_album_gen2.exe.sha256
            stamp_album_gen2-linux
            stamp_album_gen2-linux.sha256
            stamp_album_gen2-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        # Publish the previously-created draft release after assets uploaded to avoid
        # immutable-release upload errors. Uses the REST API to set draft=false.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate-release.outputs.release_tag }}"
          REPO="${GITHUB_REPOSITORY}"
          echo "Looking up release for tag $TAG in $REPO"
          release_json=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          release_id=$(echo "$release_json" | python3 -c 'import sys, json; j=json.load(sys.stdin); print(j.get("id",""))')
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Release not found for tag $TAG; creating a draft release"
            create_json=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"draft\": true}" \
              "https://api.github.com/repos/$REPO/releases")
            release_id=$(echo "$create_json" | python3 -c 'import sys, json; j=json.load(sys.stdin); print(j.get("id",""))')
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "Failed to create release for tag $TAG"; echo "$create_json" | sed -n '1,200p'; exit 1
            fi
            echo "Created release id=$release_id"
          fi
          echo "Publishing release id=$release_id"
          curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"draft":false}' "https://api.github.com/repos/$REPO/releases/$release_id" | sed -n '1,200p'
