[dependencies]
csv = "1.2"
image = { version = "0.24", features = ["png"] }
rusttype = "0.9"
scraper = "0.13"
reqwest = { version = "0.11", features = ["blocking", "json"] }
lazy_static = "1.5.0"
regex = "1.10"
rusqlite = "0.37"
log = "0.4"
env_logger = "0.10"
flexi_logger = "0.27"
indicatif = "0.17"
toml = "0.9.5"
serde = "1.0.219"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
whoami = "1.5"
sha2 = "0.10"
tempfile = { version = "3.6", optional = false }

[package]
name = "stamp_album_gen2"
version = "0.9.2"
edition = "2021"
