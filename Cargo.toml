[workspace]
members = ["crates/stamp_album_db", "."]

[profile.release]
opt-level = 3

[features]
# Default to minimal in-code country->flag mapping.
# Enable `full-flag-db` to embed and use `flags/flag_codes.json` at compile time.
default = []
full-flag-db = []

[dependencies]
csv = "1.2"
image = { version = "0.24", features = ["png"] }
rusttype = "0.9"
scraper = "0.13"
# For MUSL builds, we need rustls instead of native OpenSSL to avoid cross-compilation issues
# Using feature flags to conditionally use rustls on MUSL targets
reqwest = { version = "0.11", features = ["blocking", "json"] }
lazy_static = "1.5.0"
regex = "1.10"
rusqlite = "0.37"
log = "0.4"
stamp_album_db = { path = "crates/stamp_album_db" }
env_logger = "0.10"
flexi_logger = "0.27"
indicatif = "0.17"
toml = "0.9.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
whoami = "1.5"
sha2 = "0.10"
tempfile = { version = "3.6", optional = false }
httpmock = { version = "0.6", optional = true }
once_cell = "1.21.3"
strsim = "0.10"
atty = "0.2"
which = "4"
# Use pure-Rust SVG rasterization for deterministic CI: resvg/usvg + tiny-skia
resvg = "0.29"
usvg = "0.29"
tiny-skia = "0.8"
# Explicit OpenSSL with vendored feature for MUSL builds
openssl = { version = "0.10", optional = true, features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.6"
serial_test = "0.5"

[package]
name = "stamp_album_gen2"
version = "1.6.1"
edition = "2021"
default-run = "stamp_album_gen2"

[build-dependencies]
chrono = "0.4"
