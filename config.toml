############################################
# Stamp dimension settings
############################################

reference_width_mm = 24.0
reference_height_mm = 27.0

############################################
# Global album settings
# Maximum emitted stamp box height (mm). When the generator must fallback to
# image-size estimates it caps the computed image height at this value to avoid
# runaway sizes. Increase when you have very tall commemoratives so they are
# measured and emitted at full height.ALBUM_STAMP_IMG_NEW_SETTING
# AlbumEasy equivalent: controls the emitted STAMP_ADD_IMG height when no DB
# pixel dimensions are available.
############################################

stamp_box_height = 30.0
row_font_spacing = 0.1

############################################
# Approximate height of header-font lines in mm (used to compute header block height).
# AlbumEasy reference: header text line heights are controlled by HN/HN font sizes; 
# approximates the resulting mm height for header lines (measured: country name ≈ 5mm).
############################################

header_font_spacing = 5.0

############################################
# Header formatting options
############################################


# Date format: "dashes" (Month - Day - Year) or "commas" (Month Day, Year)
date_format = "commas"

# Label style: "abbreviated" (WM, Perf.) or "full" (Watermark, Perforation)
label_style = "full"

# Series formatting: "title" (HN 12), "subtitle" (TB 8), or "none"
series_style = "title"



# Vertical spacing between header elements
header_spacing = 10.0

############################################
# Standard font size for stamp headings (HN value)
# here is list of posible font:
############################################

# CN = Courier
# CB = Courier Bold
# CI = Courier Italic
# CS = Courier Bold-Italic
# HN = Times Roman
# TB = Times Roman Bold
# TI = Times Roman Italic
# TS = Times Roman Bold-Italic
# HN = Helvetica
# HB = Helvetica Bold
# HI = Helvetica Italic
# HS = Helvetica Bold-Italic

############################################
# Stamp heading font settings and used for STAMP_HEADING
# 
############################################

stamp_heading_font = "HN"
stamp_heading_size = 6
stamp_heading_label = "SG"

############################################
# album_pages_title_font font settings and used for STAMP_HEADING
# 
############################################

album_pages_title_font = "HN"

############################################
# Album pages header position: L (Left), R (Right), C (Centre), LR, RL
############################################

album_pages_header_position = "C"

############################################
# Optional toggles: set true to include those fields in the page header
# include_design: show the 'Design:' line when present
############################################

# Include currency field in headers: true/false
include_currency = true

# include_design: show the 'Design:' line when present
include_design = true

# include_engraving: show the 'Engraving:' line when present
include_engraving = true

# include_watermark: show the watermark line when present (default true)
include_watermark = true

# include_perforation: show the perforation line when present (default true)
include_perforation = true

# include_catalog_numbers: show catalog numbers (e.g. Scott #) when present (default)
include_catalog_numbers = true

# include_series: show the series name in the header (default true)
include_series = true

# include_country: show the country name in the header (default false)
include_country = true

# include_date: show the date line in the header (default true)
include_date = true

############################################
# --- Flag cover ---
# When false the generator will skip emitting the large flag/title cover page
# and will not attempt to download/copy a flag image for the album cover.
# Defaults to true when omitted.
# Re-enable the flag cover — set true to emit the large flag/title cover page.
############################################

print_flag_cover = true

############################################
# --- Wikipedia content ---
# When true the generator will include scraped Wikipedia postal history content
# in the album. When false, no Wikipedia content will be included.
# Defaults to true when omitted.
############################################

include_wikipedia_content = true

# --- Wikipedia Paragraph Formatting ---
# Settings for formatting Wikipedia content paragraphs using 
# PAGE_TEXT_PARAGRAPH_START END
# These provide better text formatting with justification, padding, and spacing

# Font name for Wikipedia paragraphs (AlbumEasy font code)
wikipedia_paragraph_font = "HN"

# Font size for Wikipedia paragraphs
wikipedia_paragraph_font_size = 12

# Text alignment: LEFT, RIGHT, CENTRE, CENTER, JUSTIFIED
wikipedia_paragraph_alignment = "JUSTIFIED"

# Left padding in mm (additional to page margins)
wikipedia_paragraph_padding = 10.0

# Vertical space after each paragraph in mm
wikipedia_paragraph_vspace = 5.0

# Right padding in mm (overrides left padding if specified)
wikipedia_paragraph_right_padding = 10.0

# --- Wikipedia Section Title Formatting ---
# Settings for formatting Wikipedia section titles (h2 headings)

# Font name for Wikipedia section titles (AlbumEasy font code)
wikipedia_section_title_font = "HB"

# Font size for Wikipedia section titles
wikipedia_section_title_font_size = 14

############################################
# These are wiki content font settings and used for PAGE_TEXT
# also the size and font can be adjusted here
############################################

content_wiki_font = "HN"
content_wiki_font_size = 12
content_wiki_max_lines_per_page = 5
content_wiki_estimated_chars_per_line = 250


wikipedia_cache_db_path = "wikipedia_cache.db"


############################################
# --- Page layout defaults (AlbumEasy) ---
# ALBUM_PAGES_SIZE  (216.0 279.4) 
# Page size in mm (width height). Common values: US Letter = 216 279.4, A4 = 210 297
############################################

album_page_width_mm = 216.0
album_page_height_mm = 279.4

############################################
# Page margins (top bottom) in mm
# AlbumEasy equivalent: ALBUM_PAGES_MARGINS (top bottom left right)
# ALBUM_PAGES_MARGINS  (10.0 10.0 10.0 10.0 )
# Measured on printed page: top-of-page -> top of country header ≈ 20mm, so increase top 
# margin
############################################

page_top_margin_mm = 10.0
page_bottom_margin_mm = 10.0

############################################
# Page left/right margins (mm)
############################################

page_left_margin_mm = 10.0
page_right_margin_mm = 10.0

############################################
# ALBUM_PAGES_BORDER (0.50 0.10 0.00 3.00) #outer inner1 inner2 spacing
# ALBUM_PAGES_BORDER (0.1 0.5 0.1 1.00)  thin, thick, thin
# Page border (outer, inner1, inner2, spacing) in mm used to compute usable area
############################################

page_border_outer = 0.1
page_border_inner1 = 0.5
page_border_inner2 = 0.1
page_border_spacing = 1.0

############################################
# AlbumEasy page spacing: horizontal (between decorative elements) and vertical
# ALBUM_PAGES_SPACING (3.0 6.0)
# (between header/footer areas). Matches ALBUM_PAGES_SPACING (h v).
############################################

album_pages_spacing_h = 3.0
album_pages_spacing_v = 3.0

############################################
# Maximum rows per page before forcing a new page (optional; defaults to 4 when omitted)
############################################

max_rows_per_page = 5

############################################
# When true the generator will automatically insert ROW_START_ES after PAGE_START
# ROW_START_ES (HN 6 0.1 5.0)
# Set to false to manage row starts manually in custom templates
############################################

row_start_es_enabled = true

############################################
# If enabled, a single very large stamp (or a single row that requires more than
# `single_stamp_threshold_pct` of the usable page height) will be allowed to
# occupy a page by itself rather than being split or forcing unexpected layout
# behavior. This is a preference to handle large commemoratives gracefully.
############################################

allow_single_large_stamp_per_page = true

############################################
# Fraction (0.0..1.0) of usable height above which a single-row page is
# permitted for a large stamp/row. Default 0.6 means 60% of usable height.
############################################

single_stamp_threshold_pct = 0.7

############################################
# Additional safety padding (mm) subtracted from the usable page height to
# more closely match AlbumEasy's printable area rules (header/footer and
# typographic spacing). Increase if you see rows bleeding at the bottom.
# AlbumEasy equivalent: usable pad applied when computing usable height
#  STAMP_ADD_IMG (44.0 56.8 "images/7-G1.jpg" "250(M)" "green\n\n" "35.14\n17.57")
#(this maps to the manual usable-pad subtraction you see in ALBUM_PAGES_* math)
############################################

usable_height_padding_mm = 1.0

############################################
# Fine-tunable typography and spacing to match AlbumEasy's document metrics.
# Use the AlbumEasy_4.2.1.pdf to determine exact values and adjust these if
# rows still bleed or spacing looks off.
# PAGE_VSPACE (40)
# header_vspace_before_mm: space before a series header block (AlbumEasy: gap above 
# series header)
############################################

header_vspace_before_mm = 10.0

############################################
# header_vspace_after_mm: space after the header block and before the first stamp row
# Measured on printed page: space between country and first series header ≈ 8mm (set 
# accordingly)
############################################

header_vspace_after_mm = 1.0

############################################
# Single text line height in mm (AlbumEasy text-line metric)
############################################

text_line_height_mm = 2.6

############################################
# Spacing (mm) used between images / boxes in rows
############################################

image_spacing_mm = 5.0

############################################
# ALBUM_STAMP_IMG_NEW_SETTING: width_adjust_mm, height_adjust_mm, preserve_aspect
# ALBUM_STAMP_IMG_NEW_SETTING (3.0 3.0 true)
############################################

album_stamp_img_new_setting_w_mm = 3.0
album_stamp_img_new_setting_h_mm = 3.0
album_stamp_img_new_setting_preserve_aspect = true

# How series should be ordered when generating albums: "first_date" | "first_sg" | "alpha"| "first_sg_desc"
series_order = "first_sg"

############################################
# STAMP_BOXES_SIZE_ADJUST equivalent: adds/subtracts mm to emitted stamp box sizes
############################################
stamp_box_adjust = -1.0

############################################
# Optional: maximum number of stamps allowed per row. Set to 0 to disable this cap.
# Default is 5 stamps per row which matches common album templates.
############################################

max_stamps_per_row = 5

############################################
# Debug: emit detailed per-stamp PAGE_FIT diagnostics
# uncomment to enable
# detailed debug: emit detailed per-stamp PAGE_FIT diagnostics (enable to debug fitting)
############################################
# detailed_page_fit_diagnostics = true
# emit_placeholder_diagnostics = true

# When set to "placeholders" grouped ranges like "1067-1068" will be expanded
# into individual placeholder DB rows. Other values: "detail_fetch" (not yet).
expand_grouped_ranges = "placeholders"

############################################
# Horizontal safety margin (subtract from usable page width before packing)
# AlbumEasy equivalent: this value is subtracted from ALBUM_PAGES_WIDTH to
# compute the `usable_width_after_safety` used in greedy packing (# PACK_DIAG)
############################################

packing_horizontal_safety_mm = 2.0

############################################
# Vertical safety margin (mm) subtracted from usable page height to avoid
# tight fits/bleeding at the bottom of pages. Tweak as needed.
# AlbumEasy equivalent: this value reduces the effective usable height used
# in the PAGE_FIT calculation (see `packing_vs` in PAGE_LEDGER output).
############################################

packing_vertical_safety_mm = 2.0

############################################
# Conservative buffer (mm) reserved at page bottom for footer/decoration space.
# Default: 4% of page height (scales with page size). Reduce for more aggressive
# page filling on larger pages like US Letter.
############################################

page_fit_conservative_buffer_mm = 2.0

############################################
# Additional safety margin (mm) to avoid last-line bleed due to font/rendering
# differences. Default: 0.5% of page height. Reduce for more aggressive page
# filling on larger pages.
############################################

page_fit_safety_margin_mm = 0.5

############################################
# Row bottom safety fraction - multiplier applied to max row height to add
# bottom safety margin when deciding if a row fits on current page.
# Default: 0.20 (20% of row height). Reduce for more aggressive page filling.
############################################

row_bottom_safety_fraction = 0.05

############################################
# Include stamp heading height (HN 10) into per-row vertical math
# AlbumEasy equivalent: if true, the extra heading-line height (STAMP_HEADING)
# is added to the conservative_needed value when deciding PAGE_FIT; this makes
# the PAGE_LEDGER `stamp_heading_h` field non-zero and auditable.
############################################

include_stamp_heading_in_row_height = true

############################################
# Include album pages vertical spacing (ALBUM_PAGES_SPACING vertical) as a
# per-block gap when computing whether a header+row will fit on the page
# AlbumEasy equivalent: when true, the ALBUM_PAGES_SPACING (vertical) value
# is included as a per-block vertical gap in the PAGE_FIT conservative math.
############################################

include_pages_vspace_in_row_height = true

############################################
# STAMP_HEADING(HN 10 "SG : 1")
# Height of the heading line (mm) added above each stamp row when
# include_stamp_heading_in_row_height is true. Typical values: 4.0 - 6.0
############################################

stamp_heading_height_mm = 8.0

album_pages_title_size = 10

############################################
# ROW_START_ES (HN 6 0.1 5.0)
# these values are set and used in the generated template
############################################
# Page marker settings (optional)
# Controls small helper markers emitted into AlbumEasy output. These are
# optional; defaults below preserve historical behavior used by the generator.
page_vspace_marker = "6"
# Label used for the ROW_START_ES block when emitted into the template
row_start_es_marker = "ROW_START_ES"

#row_font_spacing = "0.1"
row_start_es_font = "HN"
row_start_es_size = 6
row_start_es_spacing = 0.1
row_start_es_vspace = 0.1

############################################
# PAGE_TEXT templates and per-field overrides
# These control how PAGE_TEXT / PAGE_TEXT_CENTRE / PAGE_TEXT_RIGHT
# lines are emitted. Each full-format string must include a single
# `{}` placeholder which will be replaced with the escaped text.
# Per-field overrides (font/size/vspace) are provided for convenience
# and are used when the corresponding full-format key is not present.
############################################

# Full template with placeholder. Example: PAGE_TEXT (HN 10 "{}" 1.0)
page_text_format = 'PAGE_TEXT (HN 10 "{}" 1.0)'
page_text_font = "HN"
page_text_size = 10
page_text_vspace = 1.0

# Centre (header) template and per-field overrides
page_text_centre_format = 'PAGE_TEXT_CENTRE (TN 8 "{}" 1.0)'
page_text_centre_font = "HN"
page_text_centre_size = 8
page_text_centre_vspace = 1.0

# Right-aligned text template and per-field overrides
page_text_right_format = 'PAGE_TEXT_RIGHT (HN 10 "{}" 1.0)'
page_text_right_font = "HN"
page_text_right_size = 10
page_text_right_vspace = 1.0




############################################
# Album pages footer number settings
# Enable/disable page numbering in the footer
############################################

album_pages_footer_number_enabled = true

############################################
# Font and size for footer page numbers
############################################

album_pages_footer_number_font = "HN"
album_pages_footer_number_size = 8

############################################
# Position for footer page numbers: L (Left), R (Right), C (Centre), LR, RL
############################################

album_pages_footer_number_position = "C"

############################################
# Starting page number (default: 1)
############################################

album_pages_footer_number_start = 1

############################################
# Text to display before the page number
############################################

album_pages_footer_number_before = "Page "

############################################
# Text to display after the page number (use $PAGES$ for total page count)
############################################

album_pages_footer_number_after = " of $PAGES$"




############################################
# These are the stamp box background color
# List of available colors: white, lightgrey, grey, darkgrey, black
# yellow, orange, red, magenta, violet, blue, cyan, green, lightgreen
# You can also use HTML hex color codes like "#RRGGBB"
# Default is "white" if omitted or invalid
############################################

album_stamp_img_aspect_ratio = true

color_stamp_background = "black"

color_stamp_border = "black"
color_stamp_text = "black"
color_stamp_heading = "black"

color_album_border = "darkblue"

color_album_footer = "darkblue"
color_album_header = "darkblue"
color_album_title = "darkblue"
color_album_margin_txt = "darkblue"

############################################
# --- Flag cover (image) specific overrides ---
# These keys control the cover page when a flag image is available.
# Values are in millimetres (mm) where applicable.
############################################

# Vertical space above the flag image/title on the cover page (mm)
flag_cover_page_vspace_top = 40.0

# If a flag image is emitted, use these width/height hints (mm)
flag_cover_img_w_mm = 160.0
flag_cover_img_h_mm = 80.0

# Vertical space after the cover image (mm)
flag_cover_image_vspace_after = 12.0

# Title rendering hints for image-based cover (font, size, scale)
flag_cover_image_title_font = "HN"
flag_cover_image_title_size = 32.0
flag_cover_image_title_scale = 1.0

############################################
# --- Flag cover (text-only) overrides ---
############################################

# Vertical space above the text-only cover title (mm)
flag_cover_text_only_vspace_top = 24.0

# Title rendering hints for text-only cover
flag_cover_text_only_title_font = "HN"
flag_cover_text_only_title_size = 48.0
flag_cover_text_only_title_scale = 1.0

# Vertical space after the text-only cover title (mm)
flag_cover_text_only_vspace_after = 18.0


