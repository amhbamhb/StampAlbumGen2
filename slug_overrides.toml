# User-editable overrides for StampWorld slugs.
# Map the user-provided --site-name to the canonical StampWorld slug.
# Keys are the exact site_name values you pass on the command line.
# Values are the StampWorld slug to use (may include '!' and other punctuation).
# Example:
# [slug_overrides]
# "British-ColumbiaIsland" = "British-Columbia!Vancouver-Island"

[slug_overrides]
# Add mappings here
"British-ColumbiaIsland" = "British-Columbia!Vancouver-Island"
